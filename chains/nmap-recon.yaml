id: nmap-recon
name: "Recon — full nmap & service fingerprint"
description: >
  First-touch recon for any HTB/OSCP box. Quick discovery scan to learn open
  ports, then a versioned/scripted scan only on those ports for speed and
  noise control. Output flows directly into the Target Board (target_ip,
  open_ports, services) so every downstream chain becomes context-aware.
tags: [recon, nmap, enumeration]
difficulty: easy

inputs:
  - name: target_ip
    description: "IP of the box."
    source: target_context.ip
    required: true

steps:
  - id: tcp_discovery
    name: "Fast all-ports TCP discovery"
    inline_command: "nmap -p- --min-rate=2000 -T4 -oN tcp-ports.nmap <ip>"
    notes: |
      `-p-` covers the full 1-65535 range. Tune `--min-rate` down on flaky
      networks or up on CTFs. The output drives the auto-extract parser
      which populates target_ip + open_ports on the board.
    inputs:
      ip: "${target_ip}"
    capture:
      - var: open_ports
        regex: '^(\d{1,5})/(?:tcp|udp)\s+open'
        match: all

  - id: versioned_scan
    name: "Versioned scan + default scripts on open ports"
    inline_command: "nmap -sC -sV -p <ports> -oN versioned.nmap <ip>"
    requires: [open_ports]
    inputs:
      ip: "${target_ip}"
      ports: "${open_ports}"
    notes: |
      Now that we know what's open, get banners and run NSE default
      scripts. Look for: SMB signing, LDAP base DNs, Kerberos realm hints,
      RPC interfaces, web tech stacks, DB versions.

  - id: udp_top_100
    name: "UDP top-100 (slow but worth it)"
    inline_command: "sudo nmap -sU --top-ports 100 -oN udp-top100.nmap <ip>"
    inputs:
      ip: "${target_ip}"
    notes: |
      Skip on time-pressed CTFs unless DNS/SNMP/IKE/etc. show up later.
      DNS (53), SNMP (161), and IKE (500) regularly hide initial access.

references:
  - title: "Nmap NSE script docs"
    url:   "https://nmap.org/nsedoc/"
  - title: "HackTricks — Pentesting Methodology"
    url:   "https://book.hacktricks.wiki/en/generic-methodologies-and-resources/pentesting-methodology.html"
