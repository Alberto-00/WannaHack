id: smb-null-session-enum
name: "Recon — SMB null/guest session enumeration"
description: >
  Anonymous/guest SMB enumeration to harvest users, shares, and password
  policy without any credentials. Classic OSCP/HTB starting point when
  ports 139/445 are open and signing isn't strictly enforced.
tags: [recon, smb, null-session, enumeration]
difficulty: easy

inputs:
  - name: target_ip
    source: target_context.ip
    required: true

steps:
  - id: shares
    name: "List shares with null session"
    command_ref: nxc-smb-shares
    inputs:
      ip: "${target_ip}"
    notes: |
      Look for shares with READ/WRITE that aren't SYSVOL/NETLOGON/IPC$/Print$.
      A writable share = potential web-shell drop / phishing bait / DLL planting.

  - id: users
    name: "Enumerate users"
    command_ref: nxc-smb-users
    inputs:
      ip: "${target_ip}"
    capture:
      - var: user_list
        regex: '^[A-Z]+\s+\S+\s+\d+\s+\S+\\([A-Za-z0-9._-]+)'
        match: all

  - id: groups
    name: "Enumerate groups"
    command_ref: nxc-smb-groups
    inputs:
      ip: "${target_ip}"

  - id: password_policy
    name: "Check password policy"
    inline_command: "nxc smb <ip> -u '' -p '' --pass-pol"
    inputs:
      ip: "${target_ip}"
    notes: |
      Knowing the lockout threshold is critical before spraying. <5 = risky.

  - id: spider_readable
    name: "Spider any readable share for secrets"
    command_ref: nxc-smb-spider
    requires: []
    inputs:
      ip: "${target_ip}"
    notes: |
      Grep results for `password`, `pwd`, `cred`, web.config, unattend.xml,
      Groups.xml (cpassword), and SSH/RDP key files.

references:
  - title: "HackTricks — Pentesting SMB"
    url:   "https://book.hacktricks.wiki/en/network-services-pentesting/pentesting-smb/index.html"
  - title: "NetExec SMB module"
    url:   "https://www.netexec.wiki/smb-protocol"
